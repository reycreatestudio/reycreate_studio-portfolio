<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ReyCreate Studio | Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }


        /* =========================
           LOGIN
        ========================= */

        #login-section {
            width: min(420px, 92%);
            margin: 100px auto;
            background: #fff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        #login-section h1 {
            margin: 0 0 8px;
        }

        .login-subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        #login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #login-form input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        #login-form button {
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #111;
            color: #fff;
        }

        #login-message {
            margin-top: 15px;
            word-break: break-word;
        }


        /* =========================
           ADMIN
        ========================= */

        #admin-section {
            width: min(1100px, 94%);
            margin: 30px auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .admin-header h1 {
            margin: 0 0 5px;
        }

        .admin-header p {
            margin: 0;
            color: #777;
        }

        #logout-button {
            border: 0;
            background: #111;
            color: #fff;
            padding: 11px 18px;
            border-radius: 8px;
        }


        /* =========================
           PANEL
        ========================= */

        .admin-panel {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
        }

        .panel-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .panel-heading h2 {
            margin: 0;
        }

        #add-category {
            border: 0;
            background: #111;
            color: #fff;
            padding: 11px 16px;
            border-radius: 8px;
        }


        /* =========================
           CATEGORY TREE
        ========================= */

        #category-manager {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .category-row {
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 15px;
            background: #fafafa;
        }

        .category-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .category-name {
            font-weight: 600;
        }

        .category-info {
            color: #777;
            font-size: 13px;
            margin-top: 4px;
        }

        .category-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .category-actions button {
            border: 0;
            padding: 8px 11px;
            border-radius: 6px;
            background: #e9e9e9;
        }

        .category-actions .delete-button {
            background: #eee;
            color: #b00020;
        }

        .children {
            margin-top: 10px;
            margin-left: 25px;
            padding-left: 15px;
            border-left: 2px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            #admin-section {
                width: 94%;
                margin: 15px auto;
            }

            .admin-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .panel-heading {
                align-items: stretch;
                flex-direction: column;
            }

            .category-content {
                align-items: flex-start;
                flex-direction: column;
            }

            .category-actions {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         LOGIN
    ========================= -->

    <section id="login-section">

        <h1>ReyCreate Studio</h1>

        <p class="login-subtitle">
            Portfolio Administration
        </p>


        <form id="login-form">

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>


        <p id="login-message"></p>

    </section>



    <!-- =========================
         ADMIN DASHBOARD
    ========================= -->

    <section id="admin-section" hidden>

        <header class="admin-header">

            <div>

                <h1>
                    Portfolio Manager
                </h1>

                <p>
                    ReyCreate Studio
                </p>

            </div>


            <button id="logout-button">
                Logout
            </button>

        </header>



        <section class="admin-panel">

            <div class="panel-heading">

                <h2>
                    Categories
                </h2>

                <button id="add-category">
                    + Add Category
                </button>

            </div>


            <div id="category-manager">

    <p>
        Loading categories...
    </p>

</div>


<!-- =========================
     PHOTO MANAGER
========================= -->

<section
    id="photo-manager"
    hidden
>

    <div class="photo-header">

        <button id="back-to-categories">
            ← Categories
        </button>

        <div>

            <h2 id="current-category-name">
                Photos
            </h2>

            <p id="current-category-path">
            </p>

        </div>

        <button id="add-photo">
            + Add Photo
        </button>

    </div>


    <div id="photo-grid">

        <p>
            No photos yet.
        </p>

    </div>

</section>

        </section>

    </section>



    <!-- =========================
         FIREBASE
    ========================= -->

    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        }
        from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


        import {
            getFirestore,
            collection,
            getDocs,
            addDoc,
            updateDoc,
            deleteDoc,
            doc,
            query,
            orderBy,
            serverTimestamp
        }
        from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";



        /* =========================
           FIREBASE CONFIG
        ========================= */

        const firebaseConfig = {

            apiKey:
                "AIzaSyBlbeyeynUXvrSE-TBVjwaEiBobHTrBlQo",

            authDomain:
                "reycreatestudio-portfoli-9b09b.firebaseapp.com",

            projectId:
                "reycreatestudio-portfoli-9b09b",

            storageBucket:
                "reycreatestudio-portfoli-9b09b.firebasestorage.app",

            messagingSenderId:
                "41750977632",

            appId:
                "1:41750977632:web:f202e8614f20e5d9ceb705"

        };


        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);



        /* =========================
           ELEMENTS
        ========================= */

        const loginSection =
            document.getElementById("login-section");

        const adminSection =
            document.getElementById("admin-section");

        const loginForm =
            document.getElementById("login-form");

        const loginMessage =
            document.getElementById("login-message");

        const logoutButton =
            document.getElementById("logout-button");

        const addCategoryButton =
            document.getElementById("add-category");

        const categoryManager =
            document.getElementById("category-manager");



        /* =========================
           LOGIN
        ========================= */

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;


                loginMessage.textContent =
                    "Logging in...";


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                    loginMessage.textContent = "";

                } catch (error) {

                    console.error(error);

                    loginMessage.textContent =
                        error.code +
                        " — " +
                        error.message;

                }

            }
        );



        /* =========================
           LOGOUT
        ========================= */

        logoutButton.addEventListener(
            "click",
            async () => {

                await signOut(auth);

            }
        );



        /* =========================
           AUTH STATE
        ========================= */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (user) {

                    loginSection.hidden = true;

                    adminSection.hidden = false;

                    await loadCategories();

                } else {

                    loginSection.hidden = false;

                    adminSection.hidden = true;

                }

            }
        );



        /* =========================
           ADD ROOT CATEGORY
        ========================= */

        addCategoryButton.addEventListener(
            "click",
            async () => {

                const name =
                    prompt(
                        "Enter category name:"
                    );


                if (!name || !name.trim()) {

                    return;

                }


                try {

                    await addDoc(
                        collection(
                            db,
                            "portfolio_categories"
                        ),
                        {

                            name:
                                name.trim(),

                            description:
                                "",

                            parentId:
                                null,

                            sortOrder:
                                Date.now(),

                            visible:
                                true,

                            createdAt:
                                serverTimestamp()

                        }
                    );


                    await loadCategories();


                } catch (error) {

                    console.error(error);

                    alert(
                        "Unable to create category.\n\n" +
                        error.message
                    );

                }

            }
        );



        /* =========================
           LOAD CATEGORIES
        ========================= */

        async function loadCategories() {

            categoryManager.innerHTML =
                "<p>Loading categories...</p>";


            try {

                const categoryQuery =
                    query(
                        collection(
                            db,
                            "portfolio_categories"
                        ),
                        orderBy("sortOrder")
                    );


                const snapshot =
                    await getDocs(categoryQuery);


                const categories = [];


                snapshot.forEach(
                    (item) => {

                        categories.push({

                            id:
                                item.id,

                            ...item.data()

                        });

                    }
                );


                categoryManager.innerHTML = "";


                if (categories.length === 0) {

                    categoryManager.innerHTML =
                        "<p>No categories yet. Click + Add Category.</p>";

                    return;

                }


                const tree =
                    buildTree(
                        categories,
                        null
                    );


                renderTree(
                    tree,
                    categoryManager
                );


            } catch (error) {

                console.error(error);

                categoryManager.innerHTML =
                    "<p>Unable to load categories.</p>";

                alert(
                    "Firestore error:\n\n" +
                    error.message
                );

            }

        }



        /* =========================
           BUILD TREE
        ========================= */

        function buildTree(
            categories,
            parentId
        ) {

            return categories
                .filter(
                    category =>
                        (category.parentId || null)
                        === parentId
                )
                .map(
                    category => ({

                        ...category,

                        children:
                            buildTree(
                                categories,
                                category.id
                            )

                    })
                );

        }



        /* =========================
           RENDER TREE
        ========================= */

        function renderTree(
            categories,
            container
        ) {

            categories.forEach(
                category => {

                    const row =
                        document.createElement(
                            "div"
                        );

                    row.className =
                        "category-row";


                    const content =
                        document.createElement(
                            "div"
                        );

                    content.className =
                        "category-content";


                    const information =
                        document.createElement(
                            "div"
                        );


                    const name =
                        document.createElement(
                            "div"
                        );

                    name.className =
                        "category-name";

                    name.textContent =
                        "📁 " +
                        category.name;


                    const info =
                        document.createElement(
                            "div"
                        );

                    info.className =
                        "category-info";

                    info.textContent =
                        category.children.length +
                        " subcategor" +
                        (
                            category.children.length === 1
                                ? "y"
                                : "ies"
                        );


                    information.appendChild(name);

                    information.appendChild(info);



                    const actions =
                        document.createElement(
                            "div"
                        );

                    actions.className =
                        "category-actions";


                    /* ADD CHILD */

                    const addChild =
                        document.createElement(
                            "button"
                        );

                    addChild.textContent =
                        "+ Subcategory";


                    addChild.addEventListener(
                        "click",
                        () =>
                            addSubcategory(
                                category.id
                            )
                    );


                    /* RENAME */

                    const rename =
                        document.createElement(
                            "button"
                        );

                    rename.textContent =
                        "Rename";


                    rename.addEventListener(
                        "click",
                        () =>
                            renameCategory(
                                category
                            )
                    );


                    /* DELETE */

                    const deleteButton =
                        document.createElement(
                            "button"
                        );

                    deleteButton.textContent =
                        "Delete";

                    deleteButton.className =
                        "delete-button";


                    deleteButton.addEventListener(
                        "click",
                        () =>
                            deleteCategory(
                                category
                            )
                    );


                    actions.appendChild(addChild);

                    actions.appendChild(rename);

                    actions.appendChild(deleteButton);


                    content.appendChild(information);

                    content.appendChild(actions);

                    row.appendChild(content);



                    /* CHILDREN */

                    if (
                        category.children &&
                        category.children.length
                    ) {

                        const children =
                            document.createElement(
                                "div"
                            );

                        children.className =
                            "children";


                        renderTree(
                            category.children,
                            children
                        );


                        row.appendChild(children);

                    }


                    container.appendChild(row);

                }
            );

        }



        /* =========================
           ADD SUBCATEGORY
        ========================= */

        async function addSubcategory(
            parentId
        ) {

            const name =
                prompt(
                    "Enter subcategory name:"
                );


            if (!name || !name.trim()) {

                return;

            }


            try {

                await addDoc(
                    collection(
                        db,
                        "portfolio_categories"
                    ),
                    {

                        name:
                            name.trim(),

                        description:
                            "",

                        parentId:
                            parentId,

                        sortOrder:
                            Date.now(),

                        visible:
                            true,

                        createdAt:
                            serverTimestamp()

                    }
                );


                await loadCategories();


            } catch (error) {

                console.error(error);

                alert(
                    "Unable to create subcategory.\n\n" +
                    error.message
                );

            }

        }



        /* =========================
           RENAME
        ========================= */

        async function renameCategory(
            category
        ) {

            const newName =
                prompt(
                    "Enter new name:",
                    category.name
                );


            if (
                !newName ||
                !newName.trim() ||
                newName.trim() === category.name
            ) {

                return;

            }


            try {

                await updateDoc(
                    doc(
                        db,
                        "portfolio_categories",
                        category.id
                    ),
                    {

                        name:
                            newName.trim()

                    }
                );


                await loadCategories();


            } catch (error) {

                console.error(error);

                alert(
                    "Unable to rename category.\n\n" +
                    error.message
                );

            }

        }



        /* =========================
           DELETE
        ========================= */

        async function deleteCategory(
            category
        ) {

            const confirmed =
                confirm(
                    "Delete \"" +
                    category.name +
                    "\"?\n\n" +
                    "This will delete only the category itself. " +
                    "Any subcategories will remain in Firestore."
                );


            if (!confirmed) {

                return;

            }


            try {

                await deleteDoc(
                    doc(
                        db,
                        "portfolio_categories",
                        category.id
                    )
                );


                await loadCategories();


            } catch (error) {

                console.error(error);

                alert(
                    "Unable to delete category.\n\n" +
                    error.message
                );

            }

        }

    </script>

</body>

</html>
