<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReyCreate Studio Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .login-box {
            width: min(400px, 90%);
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
        }

        h1 {
            margin: 0 0 8px;
        }

        p {
            color: #666;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 18px;
            border: 0;
            border-radius: 8px;
            background: #111;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>ReyCreate Studio</h1>

        <p>Portfolio Administration</p>

        <input
            type="email"
            placeholder="Email"
        >

        <input
            type="password"
            placeholder="Password"
        >

        <button>
            Login
        </button>

    </div>

  <script type="module" src="admin.js"></script>

</body>
</html>
