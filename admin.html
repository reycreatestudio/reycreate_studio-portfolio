<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ReyCreate Studio | Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       LOGIN
    ========================= */

    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f5f5f5;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .login-box h1 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .login-box p {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      background: white;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #222;
    }

    .primary-btn {
      border: none;
      background: #222;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      transition: 0.2s;
    }

    .primary-btn:hover {
      opacity: 0.85;
    }

    .primary-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary-btn {
      border: 1px solid #ddd;
      background: white;
      color: #222;
      padding: 10px 15px;
      border-radius: 8px;
    }

    .danger-btn {
      border: none;
      background: #d93636;
      color: white;
      padding: 9px 12px;
      border-radius: 7px;
    }

    .small-btn {
      border: 1px solid #ddd;
      background: white;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 13px;
    }

      margin-top: 15px;
      padding: 11px 13px;
      border-radius: 8px;
      display: none;
