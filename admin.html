<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ReyCreate Studio | Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 20px;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    header h1 {
      margin-bottom: 5px;
    }

    header p {
      color: #bbb;
    }

    .login-box,
    .admin-panel {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    .login-box {
      max-width: 450px;
      margin: 50px auto;
    }

    .login-box h2 {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn {
      border: 0;
      border-radius: 7px;
      padding: 10px 15px;
      margin: 4px;
      background: #222;
      color: white;
    }

    .btn:hover {
      opacity: .85;
    }

    .btn-primary {
      background: #111;
    }

    .btn-green {
      background: #16803c;
    }

    .btn-blue {
      background: #1769aa;
    }

    .btn-red {
      background: #c62828;
    }

    .btn-gray {
      background: #777;
    }

    .btn-orange {
      background: #d97706;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .toolbar .btn {
      margin: 0;
    }

    .status {
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #e8f5e9;
      color: #166534;
    }

    .status.error {
      background: #ffebee;
      color: #b91c1c;
    }

    .status.info {
      background: #e3f2fd;
      color: #075985;
    }

    .category-tree {
      margin-top: 20px;
    }

    .category-item {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .category-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px;
    }

    .category-info {
      flex: 1;
      min-width: 0;
    }

    .category-name {
      font-weight: 700;
      font-size: 16px;
    }

    .category-meta {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    .category-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .category-actions .btn {
      font-size: 12px;
      padding: 7px 9px;
    }

    .children {
      margin-left: 25px;
      border-left: 2px solid #ddd;
      padding-left: 10px;
    }

    .hidden-label {
      color: #c62828;
      font-weight: bold;
    }

    .photo-list {
      padding: 15px;
      border-top: 1px solid #ddd;
      background: white;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .photo-card {
      border: 1px solid #ddd;
      border-radius: 9px;
      overflow: hidden;
      background: white;
    }

    .photo-preview {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      background: #eee;
    }

    .photo-info {
      padding: 10px;
    }

    .photo-title {
      font-weight: bold;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .photo-description {
      color: #777;
      font-size: 12px;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .photo-actions {
      display: flex;
      flex-wrap: wrap;
    }

    .photo-actions .btn {
      font-size: 12px;
      padding: 7px 9px;
    }

    .cover-badge {
      display: inline-block;
      background: #f59e0b;
      color: white;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 7px;
    }

    .empty {
      color: #777;
      padding: 15px;
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-modal {
      border: 0;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
    }

    .selected-file {
      margin-top: 8px;
      font-size: 13px;
      color: #555;
      word-break: break-word;
    }

    .upload-progress {
      height: 12px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
      display: none;
    }

    .upload-progress-bar {
      height: 100%;
      width: 0%;
      background: #16803c;
      transition: width .15s linear;
    }

    .upload-progress-text {
      margin-top: 7px;
      font-size: 13px;
      color: #555;
      display: none;
    }

    .logout {
      float: right;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #777;
    }

    .admin-user {
      margin-top: 8px;
      font-size: 12px;
      color: #aaa;
      word-break: break-word;
    }

    @media (max-width: 700px) {

      body {
        padding: 10px;
      }

      .category-row {
        flex-direction: column;
        align-items: stretch;
      }

      .category-actions {
        justify-content: flex-start;
      }

      .children {
        margin-left: 10px;
      }

      .photo-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 430px) {

      .photo-grid {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <header>

    <button
      id="logout-btn"
      class="btn btn-red logout"
      style="display:none;"
      type="button"
    >
      Logout
    </button>

    <h1>ReyCreate Studio</h1>

    <p>Portfolio Administration</p>

    <div
      id="admin-user"
      class="admin-user"
    ></div>

  </header>


  <!-- LOGIN -->

  <div
    id="login-section"
    class="login-box"
  >

    <h2>Admin Login</h2>

    <div
      id="login-status"
      class="status"
    ></div>

    <form id="login-form">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        id="login-btn"
        type="submit"
        class="btn btn-primary"
      >
        Login
      </button>

    </form>

  </div>


  <!-- ADMIN -->

  <div
    id="admin-section"
    class="admin-panel"
    style="display:none;"
  >

    <div
      id="admin-status"
      class="status"
    ></div>


    <div class="toolbar">

      <button
        id="add-category-btn"
        class="btn btn-primary"
        type="button"
      >
        + Add Category
      </button>


      <button
        id="refresh-btn"
        class="btn btn-gray"
        type="button"
      >
        ↻ Refresh
      </button>


      <a
        href="index.html#portfolio"
        target="_blank"
        rel="noopener"
        class="btn btn-blue"
      >
        View Portfolio
      </a>

    </div>


    <h2>Portfolio Categories</h2>


    <div
      id="category-tree"
      class="category-tree"
    >

      <div class="loading">
        Loading portfolio...
      </div>

    </div>

  </div>

</div>


<!-- =========================================
     CATEGORY MODAL
========================================= -->

<div
  id="category-modal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="category-modal-title">
        Add Category

      <button
        id="close-category-modal"
        class="close-modal"

      >
        &times;

    <div

    <form id="category-form">

</div>


<!-- =========================================

========================================= -->

>

  <div class="modal-box">

<div

>

<!-- =========================================
     JAVASCRIPT
========================================= -->

<script type="module">

/* =========================================
   FIREBASE APP
========================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


/* FIRESTORE */

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";


/* AUTH */

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


/* STORAGE */

import {
  getStorage,
  ref,
  uploadBytesResumable,
  getDownloadURL,
  deleteObject
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-storage.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBlbeyeynUXvrSE-TBVjwaEiBobHTrBlQo",

  authDomain:
    "reycreatestudio-portfoli-9b09b.firebaseapp.com",

  projectId:
    "reycreatestudio-portfoli-9b09b",

  storageBucket:
    "reycreatestudio-portfoli-9b09b.firebasestorage.app",

  messagingSenderId:
    "41750977632",

  appId:
    "1:41750977632:web:f202e8614f20e5d9ceb705"

};


/* =========================================
   INITIALIZE
========================================= */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const auth =
  getAuth(app);

const storage =
  getStorage(app);


/* =========================================
   GLOBAL DATA
========================================= */

let categories = [];
let photos = [];

let currentUser = null;


/* =========================================
   ELEMENTS
========================================= */

const loginSection =
  document.getElementById("login-section");

const adminSection =
  document.getElementById("admin-section");

const loginForm =
  document.getElementById("login-form");

const loginButton =
  document.getElementById("login-btn");

const logoutButton =
  document.getElementById("logout-btn");

const loginStatus =
  document.getElementById("login-status");

const adminStatus =
  document.getElementById("admin-status");

const categoryTree =
  document.getElementById("category-tree");

const adminUser =
  document.getElementById("admin-user");


/* =========================================
   STATUS
========================================= */

function showStatus(
  element,
  message,
  type = "info"
) {

  element.textContent =
    message;

  element.className =
    "status show " + type;

}


function clearStatus(element) {

  element.textContent =
    "";

  element.className =
    "status";

}


/* =========================================
   FIREBASE ERROR MESSAGE
========================================= */

function firebaseError(error) {

  console.error(
    "Firebase error:",
    error
  );


  const code =
    error?.code || "";


  if (
    code ===
    "auth/invalid-credential"
  ) {

    return "Invalid email or password.";

  }


  if (
    code ===
    "auth/invalid-email"
  ) {

    return "The email address is invalid.";

  }


  if (
    code ===
    "auth/user-not-found"
  ) {

    return "Admin account was not found.";

  }


  if (
    code ===
    "auth/wrong-password"
  ) {

    return "Incorrect password.";

  }


  if (
    code ===
    "auth/unauthorized-domain"
  ) {

    return "This website domain is not authorized in Firebase Authentication.";

  }


  if (
    code ===
    "storage/unauthorized"
  ) {

    return "Firebase Storage denied the upload. Check Storage Rules and make sure you are logged in.";

  }


  if (
    code ===
    "storage/unknown"
  ) {

    return "Firebase Storage returned an unknown error.";

  }


  if (
    code ===
    "storage/retry-limit-exceeded"
  ) {

    return "Firebase Storage retry limit exceeded. Check your internet connection.";

  }


  if (
    code ===
    "storage/canceled"
  ) {

    return "Upload was canceled.";

  }


  if (
    code ===
    "permission-denied"
  ) {

    return "Firestore permission denied. Check your Firestore Rules.";

  }


  return (
    code
      ? code + " — "
      : ""
  ) +
  (
    error?.message ||
    "An unknown error occurred."
  );

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;


    loginButton.disabled =
      true;


    showStatus(
      loginStatus,
      "Checking login...",
      "info"
    );


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      showStatus(
        loginStatus,
        "Login successful.",
        "success"
      );


    } catch (error) {

      showStatus(
        loginStatus,
        firebaseError(error),
        "error"
      );


      loginButton.disabled =
        false;

    }

  }
);


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
  auth,
  async user => {

    currentUser =
      user;


    if (user) {

      loginSection.style.display =
        "none";

      adminSection.style.display =
        "block";

      logoutButton.style.display =
        "block";

      adminUser.textContent =
        "Logged in as: " +
        user.email;


      await loadPortfolioData();


    } else {

      loginSection.style.display =
        "block";

      adminSection.style.display =
        "none";

      logoutButton.style.display =
        "none";

      adminUser.textContent =
        "";

      loginButton.disabled =
        false;

    }

  }
);


/* =========================================
   LOGOUT
========================================= */

logoutButton.addEventListener(
  "click",
  async () => {

    try {

      await signOut(auth);

    } catch (error) {

      showStatus(
        adminStatus,
        firebaseError(error),
        "error"
      );

    }

  }
);


/* =========================================
   LOAD DATA
========================================= */

async function loadPortfolioData() {

  if (!currentUser) {
    return;
  }


  categoryTree.innerHTML = `
    <div class="loading">
      Loading portfolio...
    </div>
  `;


  try {

    const categorySnapshot =
      await getDocs(
        query(
          collection(
            db,
            "portfolio_categories"
          ),
          orderBy("sortOrder")
        )
      );


    categories =
      categorySnapshot.docs
        .map(item => ({
          id: item.id,
          ...item.data()
        }));


    const photoSnapshot =
      await getDocs(
        query(
          collection(
            db,
            "portfolio_photos"
          ),
          orderBy("sortOrder")
        )
      );


    photos =
      photoSnapshot.docs
        .map(item => ({
          id: item.id,
          ...item.data()
        }));


    renderCategories();


  } catch (error) {

    categoryTree.innerHTML = "";

    showStatus(
      adminStatus,
      "Unable to load portfolio:\n" +
      firebaseError(error),
      "error"
    );

  }

}


/* =========================================
   SORT
========================================= */

function sortCategories(items) {

  return [...items].sort(
    (a, b) =>
      (a.sortOrder || 0) -
      (b.sortOrder || 0)
  );

}


function sortPhotos(items) {

  return [...items].sort(
    (a, b) =>
      (a.sortOrder || 0) -
      (b.sortOrder || 0)
  );

}


/* =========================================
   CHILDREN
========================================= */

function getChildren(parentId) {

  return sortCategories(
    categories.filter(
      category =>
        (category.parentId || null) ===
        (parentId || null)
    )
  );

}


/* =========================================
   CATEGORY PHOTOS
========================================= */

function getCategoryPhotos(
  categoryId
) {

  return sortPhotos(
    photos.filter(
      photo =>
        photo.categoryId ===
        categoryId
    )
  );

}


/* =========================================
   RENDER CATEGORIES
========================================= */

function renderCategories() {

  categoryTree.innerHTML =
    "";


  const rootCategories =
    getChildren(null);


  if (!rootCategories.length) {

    categoryTree.innerHTML = `
      <div class="empty">
        No categories yet.
      </div>
    `;

    return;

  }


  rootCategories.forEach(
    category => {

      categoryTree.appendChild(

    document.createElement("button");

  deleteButton.className =

  deleteButton.textContent =

  deleteButton.addEventListener(

  actions.appendChild(
    addSubcategory
  );

  actions.appendChild(

  actions.appendChild(
    rename
  );

  actions.appendChild(
    visibility
  );

  actions.appendChild(
    deleteButton
  );


  row.appendChild(

    actions

    row

          createPhotoElement(

      grid

  if (children.length) {

        childrenContainer.appendChild(
          createCategoryElement(
            child

      }

    wrapper.appendChild(
      childrenContainer
    );

========================================= */

async function deleteCategory(
  category
) {

  const children =
    getChildren(
      category.id
    );


  const categoryPhotos =
    getCategoryPhotos(
      category.id
    );


  const message =
    children.length ||
    categoryPhotos.length

      ? `Delete "${category.name}"?\n\n` +
        `This category contains ` +
        `${children.length} subcategor${
          children.length === 1
            ? "y"
            : "ies"
        } and ` +
        `${categoryPhotos.length} photo${
          categoryPhotos.length === 1
            ? ""
            : "s"
        }.\n\n` +
        `The category itself will be deleted, ` +
        `but its children/photos will remain.`

      : `Delete "${category.name}"?`;


  if (!confirm(message)) {
    return;
  }


  try {

    await deleteDoc(
      doc(
        db,
        "portfolio_categories",
        category.id
      )
    );


    showStatus(
      adminStatus,
      "Category deleted.",
      "success"
    );


    await loadPortfolioData();


  } catch (error) {

    showStatus(
      adminStatus,
      firebaseError(error),
      "error"
    );

  }

}

/* =========================================
   STORAGE UPLOAD
========================================= */

function uploadFile(
  file,
  storagePath,
  progressBar,
  progressContainer,
  progressText
) {

  return new Promise(
    (resolve, reject) => {

      if (!file) {

        reject(
          new Error(
            "No file selected."
          )
        );

        return;

      }


      if (!currentUser) {

        reject(
          new Error(
            "You are not logged in."
          )
        );

        return;

      }


      progressContainer.style.display =
        "block";

      progressText.style.display =
        "block";

      progressBar.style.width =
        "0%";

      progressText.textContent =
        "Starting upload... 0%";


      const storageReference =
        ref(
          storage,
          storagePath
        );


      const uploadTask =
        uploadBytesResumable(
          storageReference,
          file,
          {
            contentType:
              file.type
          }
        );


      uploadTask.on(

        "state_changed",

        snapshot => {

          const progress =
            (
              snapshot.bytesTransferred /
              snapshot.totalBytes
            ) * 100;


          const rounded =
            Math.round(
              progress
            );


          progressBar.style.width =
            rounded + "%";


          progressText.textContent =
            `Uploading... ${rounded}%`;


          console.log(
            `Upload: ${rounded}%`,
            snapshot.bytesTransferred,
            "/",
            snapshot.totalBytes
          );

        },

        error => {

          console.error(
            "STORAGE UPLOAD ERROR:",
            error
          );


          reject(error);

        },

        async () => {

          try {

            const url =
              await getDownloadURL(
                uploadTask.snapshot.ref
              );


            progressBar.style.width =
              "100%";


            progressText.textContent =
              "Upload complete — 100%";


            resolve({
              url,
              storagePath
            });


          } catch (error) {

            reject(error);

          }

        }

      );

    }
  );

}

photoForm.addEventListener(
  "submit",

    event.preventDefault();

      document.getElementById(

        "photo-file"

      ).value
      .trim();

      );

      return;

    }


    if (!categoryId) {

      showStatus(
        statusElement,
        "No category selected.",
        "error"
      );

      return;

    }


    /* BASIC FILE CHECK */

    const allowedTypes = [
      "image/jpeg",
      "image/png",
      "image/webp",
      "image/gif"
    ];


    if (
      !allowedTypes.includes(

      );

      return;

      "info"
    );

          .pop()
          .toLowerCase();


      const uniqueName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2, 10) +
        "." +
        extension;


      const storagePath =
        `portfolio/${categoryId}/${uniqueName}`;

        await uploadFile(
          file,
          storagePath,
          uploadProgressBar,
          uploadProgress,
          uploadProgressText
        );


      showStatus(
        statusElement,
        "Image uploaded. Saving photo information...",
        "info"
      );


      const categoryPhotos =
        getCategoryPhotos(
          categoryId
        );

        categoryPhotos.length;

        collection(
          db,
          "portfolio_photos"
        ),
        {
          categoryId,
          title,
          description,
          imageUrl:
            upload.url,
          storagePath:
            upload.storagePath,
          sortOrder,
          isCover:
            categoryPhotos.length === 0,
          visible:
            true,
          createdAt:
            serverTimestamp()
        }
      );


      showStatus(
        statusElement,
        "Photo uploaded successfully.",
        "success"
      );


      await loadPortfolioData();


      setTimeout(
        closePhotoModal,
        700
      );


    } catch (error) {

      showStatus(
        statusElement,
        "Upload failed:\n" +

        "error"
      );

    } finally {

      uploadButton.disabled =
        false;

    }

  }
);

          description,
          imageUrl,
          storagePath
        }
      );


      showStatus(
        statusElement,
        "Photo updated successfully.",
        "success"
      );


      await loadPortfolioData();


      setTimeout(
        closeEditPhotoModal,
        700
      );


    } catch (error) {

      showStatus(
        statusElement,
        firebaseError(error),
        "error"
      );

    } finally {

      saveEditButton.disabled =
        false;

    }

  }
);


/* =========================================
   SET COVER PHOTO
========================================= */

async function setCoverPhoto(
  photo,
  categoryId
) {

  try {

    const categoryPhotos =
      getCategoryPhotos(
        categoryId
      );


    for (
      const item
      of categoryPhotos
    ) {

      if (
        item.isCover === true
      ) {

        await updateDoc(
          doc(
            db,
            "portfolio_photos",
            item.id
          ),
          {
            isCover:
              false
          }
        );

      }

    }


    await updateDoc(
      doc(
        db,
        "portfolio_photos",
        photo.id
      ),
      {
        isCover:
          true
      }
    );


    showStatus(
      adminStatus,
      `"${photo.title}" is now the cover photo.`,
      "success"
    );


    await loadPortfolioData();


  } catch (error) {

    showStatus(
      adminStatus,
      firebaseError(error),
      "error"
    );

  }

}


/* =========================================
   PHOTO VISIBILITY
========================================= */

async function togglePhotoVisibility(
  photo
) {

  try {

    await updateDoc(
      doc(
        db,
        "portfolio_photos",
        photo.id
      ),
      {
        visible:
          photo.visible === false
            ? true
            : false
      }
    );


    await loadPortfolioData();


  } catch (error) {

    showStatus(
      adminStatus,
      firebaseError(error),
      "error"
    );

  }

}


/* =========================================
   DELETE PHOTO
========================================= */

async function deletePhoto(
  photo
) {

  if (
    !confirm(
      `Delete "${photo.title}"?`
    )
  ) {

    return;

  }


  try {

    /* Delete Firestore document */

    await deleteDoc(
      doc(
        db,
        "portfolio_photos",
        photo.id
      )
    );


    /* Delete Storage file */

    if (
      photo.storagePath
    ) {

      try {

        await deleteObject(
          ref(
            storage,
            photo.storagePath
          )
        );

      } catch (storageError) {

        console.warn(
          "Storage file could not be deleted:",
          storageError
        );

      }

    }


    showStatus(
      adminStatus,
      "Photo deleted.",
      "success"
    );


    await loadPortfolioData();


  } catch (error) {

    showStatus(
      adminStatus,
      firebaseError(error),
      "error"
    );

  }

}


/* =========================================
   REFRESH
========================================= */

document.getElementById(
  "refresh-btn"
).addEventListener(
  "click",
  async () => {

    await loadPortfolioData();

  }
);


/* =========================================
   CLOSE MODALS WHEN CLICKING OUTSIDE
========================================= */

[
  categoryModal,
  photoModal,
  editPhotoModal
].forEach(
  modal => {

    modal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          modal
        ) {

          modal.classList.remove(
            "show"
          );

        }

      }
    );

  }
);


/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key !==
      "Escape"
    ) {

      return;

    }


    categoryModal.classList.remove(
      "show"
    );

    photoModal.classList.remove(
      "show"
    );

    editPhotoModal.classList.remove(
      "show"
    );

  }
);

</script>
