<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReyCreate Studio | Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-container {
            width: min(420px, 92%);
        }

        #login-section {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #666;
        }

        #login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #login-message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <main class="admin-container">

        <section id="login-section">

            <h1>ReyCreate Studio</h1>

            <p class="subtitle">
                Portfolio Administration
            </p>

            <form id="login-form">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="login-message"></p>

        </section>

    </main>


    <!-- FIREBASE -->

    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

        import { getAuth, signInWithEmailAndPassword }
        from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


        const firebaseConfig = {

            apiKey: "AIzaSyBlbeyeynUXvrSE-TBVjwaEiBobHTrBlQo",

            authDomain:
                "reycreatestudio-portfoli-9b09b.firebaseapp.com",

            projectId:
                "reycreatestudio-portfoli-9b09b",

            storageBucket:
                "reycreatestudio-portfoli-9b09b.firebasestorage.app",

            messagingSenderId:
                "41750977632",

            appId:
                "1:41750977632:web:f202e8614f20e5d9ceb705"

        };


        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);


        const form =
            document.getElementById("login-form");

        const message =
            document.getElementById("login-message");


        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            message.textContent = "Logging in...";

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            try {

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                message.textContent =
                    "Login successful!";

                console.log(
                    "Logged in:",
                    userCredential.user.email
                );


            } catch (error) {

                console.error(error);

                message.textContent =
                    error.code + " — " + error.message;

            }

        });

    </script>

</body>

</html>
