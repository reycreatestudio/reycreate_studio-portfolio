<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ReyCreate Studio | Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 20px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    header h1 {
      margin-bottom: 5px;
    }

    header p {
      color: #bbb;
    }

    .login-box,
    .admin-panel {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    .login-box {
      max-width: 450px;
      margin: 50px auto;
    }

    .login-box h2 {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn {
      border: 0;
      border-radius: 7px;
      padding: 10px 15px;
      margin: 4px;
      background: #222;
      color: white;
    }

    .btn:hover {
      opacity: .85;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #111;
    }

    .btn-green {
      background: #16803c;
    }

    .btn-blue {
      background: #1769aa;
    }

    .btn-red {
      background: #c62828;
    }

    .btn-gray {
      background: #777;
    }

    .btn-orange {
      background: #d97706;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .toolbar .btn {
      margin: 0;
    }

    .status {
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #e8f5e9;
      color: #166534;
    }

    .status.error {
      background: #ffebee;
      color: #b91c1c;
    }

    .status.info {
      background: #e3f2fd;
      color: #075985;
    }

    .category-tree {
      margin-top: 20px;
    }

    .category-item {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .category-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px;
    }

    .category-info {
      flex: 1;
      min-width: 0;
    }

    .category-name {
      font-weight: 700;
      font-size: 16px;
    }

    .category-meta {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    .category-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .children {
      margin-left: 25px;
      border-left: 2px solid #ddd;
      padding-left: 10px;
    }

    .hidden-label {
      color: #c62828;
      font-weight: bold;
    }

    .photo-list {
      padding: 15px;
      border-top: 1px solid #ddd;
      background: white;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .photo-card {
      border: 1px solid #ddd;
      border-radius: 9px;
      overflow: hidden;
      background: white;
    }

    .photo-preview {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      background: #eee;
    }

    .photo-info {
      padding: 10px;
    }

    .photo-title {
      font-weight: bold;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .photo-description {
      color: #777;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .photo-actions {
      display: flex;
      flex-wrap: wrap;
    }

    .photo-actions .btn {
      font-size: 12px;
      padding: 7px 9px;
    }

    .cover-badge {
      display: inline-block;
      background: #f59e0b;
      color: white;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 7px;
    }

    .empty {
      color: #777;
      padding: 15px;
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-modal {
      border: 0;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
    }

    .selected-file {
      margin-top: 8px;
      font-size: 13px;
      color: #555;
      word-break: break-word;
    }

    .upload-progress {
      height: 8px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
      display: none;
    }

    .upload-progress-bar {
      height: 100%;
      width: 0%;
      background: #16803c;
      transition: width .2s;
    }

    .logout {
      float: right;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #777;
    }

    @media (max-width: 700px) {
      body {
        padding: 10px;
      }

      .category-row {
        flex-direction: column;
        align-items: stretch;
      }

      .category-actions {
        justify-content: flex-start;
      }

      .children {
        margin-left: 10px;
      }

      .photo-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 430px) {
      .photo-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <button
      id="logout-btn"
      class="btn btn-red logout"
      style="display:none;"
      type="button"
    >
      Logout
    </button>

    <h1>ReyCreate Studio</h1>
    <p>Portfolio Administration</p>
  </header>

  <!-- LOGIN -->

  <div id="login-section" class="login-box">

    <h2>Admin Login</h2>

    <div id="login-status" class="status"></div>

    <form id="login-form">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button
        id="login-btn"
        type="submit"
        class="btn btn-primary"
      >
        Login
      </button>

    </form>

  </div>

  <!-- ADMIN -->

  <div
    id="admin-section"
    class="admin-panel"
    style="display:none;"
  >

    <div id="admin-status" class="status"></div>

    <div class="toolbar">

      <button
        id="add-category-btn"
        class="btn btn-primary"
        type="button"
      >
        + Add Category
      </button>

      <button
        id="refresh-btn"
        class="btn btn-gray"
        type="button"
      >
        ↻ Refresh
      </button>

      <a
        href="index.html#portfolio"
        target="_blank"
        rel="noopener"
        class="btn btn-blue"
      >
        View Portfolio
      </a>

    </div>

    <h2>Portfolio Categories</h2>

    <div
      id="category-tree"
      class="category-tree"
    >
      <div class="loading">
        Loading portfolio...
      </div>
    </div>

  </div>

</div>

<!-- PHOTO MODAL -->

<div id="photo-modal" class="modal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Add Photo</h2>

      <button
        id="close-photo-modal"
        class="close-modal"
        type="button"
      >
        &times;
      </button>
    </div>

    <div id="photo-status" class="status"></div>

    <form id="photo-form">

      <div class="form-group">

        <label for="photo-file">Choose Image</label>

        <input
          id="photo-file"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/gif"
          required
        >

        <div id="selected-file" class="selected-file"></div>

      </div>

      <div class="form-group">

        <label for="photo-title">Photo Title</label>

        <input
          id="photo-title"
          type="text"
          required
          placeholder="Example: Wedding Ceremony"
        >

      </div>

      <div class="form-group">

        <label for="photo-description">Description</label>

        <textarea
          id="photo-description"
          placeholder="Optional description"
        ></textarea>

      </div>

      <div
        id="upload-progress"
        class="upload-progress"
      >
        <div
          id="upload-progress-bar"
          class="upload-progress-bar"
        ></div>
      </div>

      <button
        id="upload-photo-btn"
        type="submit"
        class="btn btn-green"
      >
        Upload Photo
      </button>

      <button
        id="cancel-photo-btn"
        type="button"
        class="btn btn-gray"
      >
        Cancel
      </button>

    </form>

  </div>

</div>

<!-- EDIT PHOTO MODAL -->

<div id="edit-photo-modal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>Edit Photo</h2>

      <button
        id="close-edit-photo-modal"
        class="close-modal"
        type="button"
      >
        &times;
      </button>

    </div>

    <div id="edit-photo-status" class="status"></div>

    <form id="edit-photo-form">

      <input
        id="edit-photo-id"
        type="hidden"
      >

      <div class="form-group">

        <label for="edit-photo-title">
          Photo Title
        </label>

        <input
          id="edit-photo-title"
          type="text"
          required
        >

      </div>

      <div class="form-group">

        <label for="edit-photo-description">
          Description
        </label>

        <textarea
          id="edit-photo-description"
        ></textarea>

      </div>

      <div class="form-group">

        <label for="edit-photo-file">
          Replace Image
        </label>

        <input
          id="edit-photo-file"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/gif"
        >

      </div>

      <button
        type="submit"
        class="btn btn-green"
      >
        Save Changes
      </button>

      <button
        id="cancel-edit-photo-btn"
        type="button"
        class="btn btn-gray"
      >
        Cancel
      </button>

    </form>

  </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytesResumable,
  getDownloadURL,
  deleteObject
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-storage.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBlbeyeynUXvrSE-TBVjwaEiBobHTrBlQo",

  authDomain:
    "reycreatestudio-portfoli-9b09b.firebaseapp.com",

  projectId:
    "reycreatestudio-portfoli-9b09b",

  storageBucket:
    "reycreatestudio-portfoli-9b09b.firebasestorage.app",

  messagingSenderId:
    "41750977632",

  appId:
    "1:41750977632:web:f202e8614f20e5d9ceb705"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const storage =
  getStorage(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loginSection =
  document.getElementById("login-section");

const adminSection =
  document.getElementById("admin-section");

const loginForm =
  document.getElementById("login-form");

const loginButton =
  document.getElementById("login-btn");

const logoutBtn =
  document.getElementById("logout-btn");

const categoryTree =
  document.getElementById("category-tree");

const addCategoryBtn =
  document.getElementById("add-category-btn");

const refreshBtn =
  document.getElementById("refresh-btn");

const photoModal =
  document.getElementById("photo-modal");

const editPhotoModal =
  document.getElementById("edit-photo-modal");

const uploadProgress =
  document.getElementById("upload-progress");

const uploadProgressBar =
  document.getElementById("upload-progress-bar");


let categories = [];

let photos = [];

let currentPhotoCategoryId = null;


/*
   Prevent duplicate portfolio loading
   while Firebase auth state is settling.
*/

let loadingPortfolio = false;


/* =====================================================
   STATUS
===================================================== */

function showStatus(
  element,
  message,
  type = "info"
) {

  element.textContent =
    message;

  element.className =
    "status show " + type;
}


function hideStatus(element) {

  element.textContent = "";

  element.className =
    "status";
}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    const status =
      document.getElementById(
        "login-status"
      );


    if (!email || !password) {
      return;
    }


    try {

      loginButton.disabled = true;

      showStatus(
        status,
        "Logging in...",
        "info"
      );


      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      /*
         Do NOT manually show admin here.

         Firebase onAuthStateChanged()
         will handle it exactly once.
      */

    } catch (error) {

      console.error(
        "Login error:",
        error
      );

      showStatus(
        status,
        getFirebaseErrorMessage(error),
        "error"
      );

    } finally {

      loginButton.disabled = false;

    }

  }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
  "click",
  async () => {

    try {

      logoutBtn.disabled = true;

      await signOut(auth);

    } catch (error) {

      console.error(
        "Logout error:",
        error
      );

    } finally {

      logoutBtn.disabled = false;

    }

  }
);


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  async (user) => {

    console.log(
      "Firebase auth state:",
      user ? user.email : "signed out"
    );


    if (user) {

      /*
         USER IS LOGGED IN
      */

      loginSection.style.display =
        "none";

      adminSection.style.display =
        "block";

      logoutBtn.style.display =
        "block";


      hideStatus(
        document.getElementById(
          "login-status"
        )
      );


      /*
         Load only once.
      */

      if (!loadingPortfolio) {

        await loadPortfolio();

      }


    } else {

      /*
         USER IS LOGGED OUT
      */

      loginSection.style.display =
        "block";

      adminSection.style.display =
        "none";

      logoutBtn.style.display =
        "none";

      loadingPortfolio = false;

    }

  }
);


/* =====================================================
   LOAD PORTFOLIO
===================================================== */

async function loadPortfolio() {

  if (loadingPortfolio) {
    return;
  }

  loadingPortfolio = true;


  const status =
    document.getElementById(
      "admin-status"
    );


  try {

    categoryTree.innerHTML =
      '<div class="loading">Loading portfolio...</div>';


    /*
       CATEGORIES
    */

    const categorySnapshot =
      await getDocs(
        query(
          collection(
            db,
            "portfolio_categories"
          ),
          orderBy("sortOrder")
        )
      );


    categories =
      categorySnapshot.docs.map(
        item => ({
          id: item.id,
          ...item.data()
        })
      );


    /*
       PHOTOS
    */

    const photoSnapshot =
      await getDocs(
        query(
          collection(
            db,
            "portfolio_photos"
          ),
          orderBy("sortOrder")
        )
      );


    photos =
      photoSnapshot.docs.map(
        item => ({
          id: item.id,
          ...item.data()
        })
      );


    renderCategories();

    hideStatus(status);


  } catch (error) {

    console.error(
      "Portfolio loading error:",
      error
    );


    showStatus(
      status,
      "Error loading portfolio: " +
      error.message,
      "error"
    );


    categoryTree.innerHTML =
      '<div class="empty">' +
      'Unable to load portfolio.' +
      '</div>';

  } finally {

    loadingPortfolio = false;

  }

}


refreshBtn.addEventListener(
  "click",
  async () => {

    if (loadingPortfolio) {
      return;
    }

    await loadPortfolio();

  }
);


/* =====================================================
   CATEGORY TREE
===================================================== */

function getChildren(parentId) {

  return categories
    .filter(category =>
      (category.parentId || null) === parentId
    )
    .sort(
      (a, b) =>
        (a.sortOrder || 0) -
        (b.sortOrder || 0)
    );

}


/* =====================================================
   RENDER CATEGORIES
===================================================== */

function renderCategories() {

  categoryTree.innerHTML = "";


  const roots =
    getChildren(null);


  if (!roots.length) {

    categoryTree.innerHTML =
      '<div class="empty">' +
      'No categories yet.' +
      '</div>';

    return;

  }


  roots.forEach(category => {

    categoryTree.appendChild(
      createCategoryElement(category)
    );

  });

}


/* =====================================================
   CREATE CATEGORY
===================================================== */

function createCategoryElement(category) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "category-item";

  wrapper.dataset.categoryId =
    category.id;


  const row =
    document.createElement("div");

  row.className =
    "category-row";


  const info =
    document.createElement("div");

  info.className =
    "category-info";


  const name =
    document.createElement("div");

  name.className =
    "category-name";

  name.textContent =
    category.name || "Untitled";


  const meta =
    document.createElement("div");

  meta.className =
    "category-meta";


  const photoCount =
    photos.filter(
      photo =>
        photo.categoryId === category.id
    ).length;


  const childCount =
    categories.filter(
      item =>
        item.parentId === category.id
    ).length;


  meta.textContent =
    `${photoCount} photo(s) • ` +
    `${childCount} subcategory(ies)`;


  if (category.visible === false) {

    const hidden =
      document.createElement("span");

    hidden.className =
      "hidden-label";

    hidden.textContent =
      " • Hidden";

    meta.appendChild(hidden);

  }


  info.appendChild(name);

  info.appendChild(meta);


  const actions =
    document.createElement("div");

  actions.className =
    "category-actions";


  const photoBtn =
    makeButton(
      "Photos",
      "btn btn-green"
    );

  photoBtn.onclick =
    () =>
      openPhotoManager(
        category.id
      );


  const subBtn =
    makeButton(
      "+ Subcategory",
      "btn btn-blue"
    );

  subBtn.onclick =
    () =>
      addCategory(
        category.id
      );


  const renameBtn =
    makeButton(
      "Rename",
      "btn btn-gray"
    );

  renameBtn.onclick =
    () =>
      renameCategory(
        category
      );


  const visibilityBtn =
    makeButton(
      category.visible === false
        ? "Show"
        : "Hide",
      "btn btn-orange"
    );

  visibilityBtn.onclick =
    () =>
      toggleCategoryVisibility(
        category
      );


  const deleteBtn =
    makeButton(
      "Delete",
      "btn btn-red"
    );

  deleteBtn.onclick =
    () =>
      deleteCategory(
        category
      );


  actions.appendChild(photoBtn);

  actions.appendChild(subBtn);

  actions.appendChild(renameBtn);

  actions.appendChild(visibilityBtn);

  actions.appendChild(deleteBtn);


  row.appendChild(info);

  row.appendChild(actions);

  wrapper.appendChild(row);


  /*
     CHILDREN
  */

  const children =
    getChildren(category.id);


  if (children.length) {

    const childContainer =
      document.createElement("div");

    childContainer.className =
      "children";


    children.forEach(child => {

      childContainer.appendChild(
        createCategoryElement(child)
      );

    });


    wrapper.appendChild(
      childContainer
    );

  }


  return wrapper;

}


/* =====================================================
   BUTTON HELPER
===================================================== */

function makeButton(
  text,
  className
) {

  const button =
    document.createElement("button");

  button.type =
    "button";

  button.textContent =
    text;

  button.className =
    className;

  return button;

}


/* =====================================================
   ADD CATEGORY
===================================================== */

addCategoryBtn.addEventListener(
  "click",
  () => addCategory(null)
);


async function addCategory(parentId) {

  const name =
    prompt(
      parentId
        ? "Subcategory name:"
        : "Category name:"
    );


  if (!name || !name.trim()) {
    return;
  }


  try {

    const siblings =
      getChildren(parentId);


    await addDoc(
      collection(
        db,
        "portfolio_categories"
      ),
      {
        name: name.trim(),

        description: "",

        parentId:
          parentId || null,

        sortOrder:
          siblings.length,

        visible:
          true,

        createdAt:
          serverTimestamp()
      }
    );


    await loadPortfolio();


  } catch (error) {

    console.error(error);

    alert(
      "Error creating category:\n" +
      error.message
    );

  }

}

  }


  try {

    await updateDoc(

      ),

      }
    );

  } catch (error) {

/* =====================================================
   DELETE CATEGORY
===================================================== */

async function deleteCategory(category) {

  const children =
    categories.filter(
      item =>
        item.parentId === category.id
    );


  const categoryPhotos =
    photos.filter(
      photo =>
        photo.categoryId === category.id
    );


  if (children.length) {

    alert(
      "This category contains subcategories.\n\n" +
      "Delete the subcategories first."
    );

    return;

  }


  if (categoryPhotos.length) {

    alert(
      "This category still contains photos.\n\n" +
      "Delete the photos first."
    );

    return;

  }


  if (
    !confirm(
      `Delete "${category.name}"?`
    )
  ) {
    return;
  }


  try {

    await deleteDoc(
      doc(
        db,
        "portfolio_categories",
        category.id
      )
    );


    await loadPortfolio();


  } catch (error) {

    alert(
      "Error deleting category:\n" +
      error.message
    );

  }

}


/* =====================================================
   PHOTO MANAGER
===================================================== */

function openPhotoManager(categoryId) {

  currentPhotoCategoryId =
    categoryId;


  const category =
    categories.find(
      item =>
        item.id === categoryId
    );


  if (!category) {
    return;
  }


  const existing =
    document.getElementById(
      "photo-manager-" +
      categoryId
    );


  /*
     Close if already open.
  */

  if (existing) {

    existing.remove();

    return;

  }


  const container =
    document.createElement("div");

  container.className =
    "photo-list";

  container.id =
    "photo-manager-" +
    categoryId;


  const heading =
    document.createElement("div");

  heading.style.marginBottom =
    "15px";


  const headingText =
    document.createElement("strong");

  headingText.textContent =
    "Photos in: " +
    category.name;


  heading.appendChild(
    headingText
  );


  const addBtn =
    makeButton(
      "+ Add Photo",
      "btn btn-green"
    );


  addBtn.onclick =
    () =>
      openAddPhotoModal(
        categoryId
      );


  heading.appendChild(addBtn);


  container.appendChild(
    heading
  );


  const categoryPhotos =
    photos
      .filter(
        photo =>
          photo.categoryId ===
          categoryId
      )
      .sort(
        (a, b) =>
          (a.sortOrder || 0) -
          (b.sortOrder || 0)
      );


  if (!categoryPhotos.length) {

    const empty =
      document.createElement("div");

    empty.className =
      "empty";

    empty.textContent =
      "No photos in this category.";

    container.appendChild(
      empty
    );

  } else {

    const grid =
      document.createElement("div");

    grid.className =
      "photo-grid";


    categoryPhotos.forEach(
      photo => {

        grid.appendChild(
          createPhotoCard(photo)
        );

      }
    );


    container.appendChild(
      grid
    );

  }


  const categoryElement =
    document.querySelector(
      `[data-category-id="${CSS.escape(categoryId)}"]`
    );


  if (categoryElement) {

    categoryElement.appendChild(
      container
    );

  }

}


/* =====================================================
   PHOTO CARD
===================================================== */

function createPhotoCard(photo) {

  const card =
    document.createElement("div");

  card.className =
    "photo-card";


  const image =
    document.createElement("img");

  image.className =
    "photo-preview";

  image.src =
    photo.imageUrl || "";

  image.alt =
    photo.title || "";

  image.loading =
    "lazy";


  const info =
    document.createElement("div");

  info.className =
    "photo-info";


  if (photo.isCover) {

    const badge =
      document.createElement("div");

    badge.className =
      "cover-badge";

    badge.textContent =
      "★ COVER";

    info.appendChild(
      badge
    );

  }


  const title =
    document.createElement("div");

  title.className =
    "photo-title";

  title.textContent =
    photo.title ||
    "Untitled";


  const description =
    document.createElement("div");

  description.className =
    "photo-description";

  description.textContent =
    photo.description ||
    "";


  const actions =
    document.createElement("div");

  actions.className =
    "photo-actions";


  if (!photo.isCover) {

    const coverBtn =
      makeButton(
        "Set Cover",
        "btn btn-orange"
      );

    coverBtn.onclick =
      () =>
        setCover(photo);

    actions.appendChild(
      coverBtn
    );

  }


  const editBtn =
    makeButton(
      "Edit",
      "btn btn-blue"
    );

  editBtn.onclick =
    () =>
      openEditPhotoModal(photo);


  const visibilityBtn =
    makeButton(
      photo.visible === false
        ? "Show"
        : "Hide",
      "btn btn-gray"
    );

  visibilityBtn.onclick =
    () =>
      togglePhotoVisibility(photo);


  const deleteBtn =
    makeButton(
      "Delete",
      "btn btn-red"
    );

  deleteBtn.onclick =
    () =>
      deletePhoto(photo);


  actions.appendChild(editBtn);

  actions.appendChild(
    visibilityBtn
  );

  actions.appendChild(
    deleteBtn
  );


  info.appendChild(title);

  info.appendChild(description);

  info.appendChild(actions);


  card.appendChild(image);

  card.appendChild(info);


  return card;

}

/* =====================================================
   UPLOAD PHOTO
===================================================== */

document
  .getElementById(
    "photo-form"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const file =
        document
          .getElementById(
            "photo-file"
          )
          .files[0];


      const title =
        document
          .getElementById(
            "photo-title"
          )
          .value
          .trim();


      const description =
        document
          .getElementById(
            "photo-description"
          )
          .value
          .trim();


      if (!file) {

        alert(
          "Please choose an image."
        );

        return;

      }


      if (!title) {

        alert(
          "Please enter a photo title."
        );

        return;

      }


      if (!currentPhotoCategoryId) {

        alert(
          "No category selected."
        );

        return;

      }


      const status =
        document.getElementById(
          "photo-status"
        );


      const uploadButton =
        document.getElementById(
          "upload-photo-btn"
        );


      try {

        uploadButton.disabled =
          true;


        uploadProgress.style.display =
          "block";


        showStatus(
          status,
          "Uploading image...",
          "info"
        );


        const safeName =
          sanitizeFilename(
            file.name
          );


        const uniqueName =
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2, 8) +
          "_" +
          safeName;


        const storagePath =
          `portfolio/${currentPhotoCategoryId}/${uniqueName}`;


        const storageRef =
          ref(
            storage,
            storagePath
          );


        const uploadTask =
          uploadBytesResumable(
            storageRef,
            file,
            {
              contentType:
                file.type
            }
          );


        uploadTask.on(
          "state_changed",

          snapshot => {

            const progress =
              (
                snapshot.bytesTransferred /
                snapshot.totalBytes
              ) * 100;


            uploadProgressBar.style.width =
              progress + "%";


            showStatus(
              status,
              "Uploading image... " +
              Math.round(progress) +
              "%",
              "info"
            );

          },

          error => {

            console.error(
              "Upload error:",
              error
            );


            showStatus(
              status,
              "Upload failed: " +
              error.message,
              "error"
            );


            uploadButton.disabled =
              false;

          },

          async () => {

            try {

              const imageUrl =
                await getDownloadURL(
                  uploadTask.snapshot.ref
                );


              const categoryPhotos =
                photos.filter(
                  photo =>
                    photo.categoryId ===
                    currentPhotoCategoryId
                );


                await addDoc(
                  collection(
                    db,
                    "portfolio_photos"
                  ),
                  {
                    categoryId:
                      currentPhotoCategoryId,

                    title:
                      title,

                    description:
                      description,

                    imageUrl:
                      imageUrl,

                    storagePath:
                      storagePath,

                    sortOrder:
                      categoryPhotos.length,

                    isCover:
                      categoryPhotos.length === 0,

                    visible:
                      true,

                    createdAt:
                      serverTimestamp()
                  }
                );


                showStatus(
                  status,
                  "Photo uploaded successfully!",
                  "success"
                );


                await loadPortfolio();


                setTimeout(
                  () => {

                    closePhotoModal();

                    uploadButton.disabled =
                      false;

                  },
                  700
                );


            } catch (error) {

              console.error(
                "Database error:",
                error
              );


              showStatus(
                status,
                "Could not save photo: " +
                error.message,
                "error"
              );


              uploadButton.disabled =
                false;

            }

          }
        );


      } catch (error) {

        console.error(error);

        showStatus(
          status,
          error.message,
          "error"
        );

        uploadButton.disabled =
          false;

      }

    }
  );


/* =====================================================
   SET COVER
===================================================== */

async function setCover(photo) {

  try {

    const categoryPhotos =
      photos.filter(
        item =>
          item.categoryId ===
          photo.categoryId
      );


    for (
      const item
      of categoryPhotos
    ) {

      await updateDoc(
        doc(
          db,
          "portfolio_photos",
          item.id
        ),
        {
          isCover:
            item.id === photo.id
        }
      );

    }


    await loadPortfolio();


  } catch (error) {

    console.error(error);

    alert(
      "Error setting cover:\n" +
      error.message
    );

  }

}


/* =====================================================
   EDIT PHOTO
===================================================== */

function openEditPhotoModal(photo) {

  document
    .getElementById(
      "edit-photo-id"
    )
    .value =
    photo.id;


  document
    .getElementById(
      "edit-photo-title"
    )
    .value =
    photo.title || "";


  document
    .getElementById(
      "edit-photo-description"
    )
    .value =
    photo.description || "";


  document
    .getElementById(
      "edit-photo-file"
    )
    .value = "";


  hideStatus(
    document.getElementById(
      "edit-photo-status"
    )
  );


  editPhotoModal.classList.add(
    "show"
  );

}


function closeEditPhotoModal() {

  editPhotoModal.classList.remove(
    "show"
  );

}


document
  .getElementById(
    "close-edit-photo-modal"
  )
  .addEventListener(
    "click",
    closeEditPhotoModal
  );


document
  .getElementById(
    "cancel-edit-photo-btn"
  )
  .addEventListener(
    "click",
    closeEditPhotoModal
  );


document
  .getElementById(
    "edit-photo-form"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const id =
        document
          .getElementById(
            "edit-photo-id"
          )
          .value;


      const photo =
        photos.find(
          item =>
            item.id === id
        );


      if (!photo) {
        return;
      }


      const title =
        document
          .getElementById(
            "edit-photo-title"
          )
          .value
          .trim();


      const description =
        document
          .getElementById(
            "edit-photo-description"
          )
          .value
          .trim();


      const newFile =
        document
          .getElementById(
            "edit-photo-file"
          )
          .files[0];


      const status =
        document.getElementById(
          "edit-photo-status"
        );


      try {

        showStatus(
          status,
          "Saving changes...",
          "info"
        );


        let imageUrl =
          photo.imageUrl;


        let storagePath =
          photo.storagePath;


        if (newFile) {

          const safeName =
            sanitizeFilename(
              newFile.name
            );


          const uniqueName =
            Date.now() +
            "_" +
            Math.random()
              .toString(36)
              .substring(2, 8) +
            "_" +
            safeName;


          const newPath =
            `portfolio/${photo.categoryId}/${uniqueName}`;


          const newRef =
            ref(
              storage,
              newPath
            );


          const uploadTask =
            uploadBytesResumable(
              newRef,
              newFile,
              {
                contentType:
                  newFile.type
              }
            );


          const snapshot =
            await waitForUpload(
              uploadTask
            );


          imageUrl =
            await getDownloadURL(
              snapshot.ref
            );


          storagePath =
            newPath;


          if (photo.storagePath) {

            try {

              await deleteObject(
                ref(
                  storage,
                  photo.storagePath
                )
              );

            } catch (error) {

              console.warn(
                "Old image could not be deleted:",
                error
              );

            }

          }

        }


        await updateDoc(
          doc(
            db,
            "portfolio_photos",
            id
          ),
          {
            title:
              title,

            description:
              description,

            imageUrl:
              imageUrl,

            storagePath:
              storagePath
          }
        );


        showStatus(
          status,
          "Photo updated!",
          "success"
        );


        await loadPortfolio();


        setTimeout(
          closeEditPhotoModal,
          600
        );


      } catch (error) {

        console.error(error);

        showStatus(
          status,
          error.message,
          "error"
        );

      }

    }
  );


/* =====================================================
   WAIT FOR UPLOAD
===================================================== */

function waitForUpload(
  uploadTask
) {

  return new Promise(
    (resolve, reject) => {

      uploadTask.on(
        "state_changed",

        snapshot => {

          const progress =
            (
              snapshot.bytesTransferred /
              snapshot.totalBytes
            ) * 100;

          console.log(
            "Edit upload:",
            Math.round(progress) + "%"
          );

        },

        error => {
          reject(error);
        },

        () => {
          resolve(
            uploadTask.snapshot
          );
        }
      );

    }
  );

}

/* =====================================================
   DELETE PHOTO
===================================================== */

async function deletePhoto(photo) {

  if (
    !confirm(
      `Delete "${photo.title}"?\n\n` +
      "This will also delete the image from Firebase Storage."
    )
  ) {
    return;
  }


  try {

    if (photo.storagePath) {

      try {

        await deleteObject(
          ref(
            storage,
            photo.storagePath
          )
        );

      } catch (storageError) {

        console.warn(
          "Storage file could not be deleted:",
          storageError
        );

      }

    }


    await deleteDoc(
      doc(
        db,
        "portfolio_photos",
        photo.id
      )
    );


    await loadPortfolio();


  } catch (error) {

    console.error(error);

    alert(
      "Error deleting photo:\n" +
      error.message
    );

  }

}


/* =====================================================
   HELPERS
===================================================== */

function sanitizeFilename(
  filename
) {

  return filename
    .replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );

}


function formatBytes(bytes) {

  if (!bytes) {
    return "0 Bytes";
  }


  const sizes = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];


  const i =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  return (
    parseFloat(
      (
        bytes /
        Math.pow(
          1024,
          i
        )
      ).toFixed(2)
    ) +
    " " +
    sizes[i]
  );

}


function getFirebaseErrorMessage(
  error
) {

  switch (
    error.code
  ) {

    case "auth/invalid-credential":
      return "Incorrect email or password.";

    case "auth/invalid-email":
      return "Please enter a valid email address.";

    case "auth/user-disabled":
      return "This account has been disabled.";

    case "auth/too-many-requests":
      return "Too many login attempts. Please try again later.";

    case "auth/network-request-failed":
      return "Network error. Check your internet connection.";

    default:
      return error.message ||
        "Login failed.";

  }

}
