<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ReyCreate Studio | Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 20px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    header h1 {
      margin-bottom: 5px;
    }

    header p {
      color: #bbb;
    }

    .login-box,
    .admin-panel {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    .login-box {
      max-width: 450px;
      margin: 50px auto;
    }

    .login-box h2 {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn {
      border: 0;
      border-radius: 7px;
      padding: 10px 15px;
      margin: 4px;
      background: #222;
      color: white;
    }

    .btn:hover {
      opacity: .85;
    }

    .btn-primary {
      background: #111;
    }

    .btn-green {
      background: #16803c;
    }

    .btn-blue {
      background: #1769aa;
    }

    .btn-red {
      background: #c62828;
    }

    .btn-gray {
      background: #777;
    }

    .btn-orange {
      background: #d97706;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .toolbar .btn {
      margin: 0;
    }

    .status {
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #e8f5e9;
      color: #166534;
    }

    .status.error {
      background: #ffebee;
      color: #b91c1c;
    }

    .status.info {
      background: #e3f2fd;
      color: #075985;
    }

    .category-tree {
      margin-top: 20px;
    }

    .category-item {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .category-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px;
    }

    .category-info {
      flex: 1;
      min-width: 0;
    }

    .category-name {
      font-weight: 700;
      font-size: 16px;
    }

    .category-meta {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    .category-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .children {
      margin-left: 25px;
      border-left: 2px solid #ddd;
      padding-left: 10px;
    }

    .cover-label {
      color: #d97706;
      font-weight: bold;
    }

    .hidden-label {
      color: #c62828;
      font-weight: bold;
    }

    .photo-list {
      padding: 15px;
      border-top: 1px solid #ddd;
      background: white;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .photo-card {
      border: 1px solid #ddd;
      border-radius: 9px;
      overflow: hidden;
      background: white;
    }

    .photo-preview {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      background: #eee;
    }

    .photo-info {
      padding: 10px;
    }

    .photo-title {
      font-weight: bold;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .photo-description {
      color: #777;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .photo-actions {
      display: flex;
      flex-wrap: wrap;
    }

    .photo-actions .btn {
      font-size: 12px;
      padding: 7px 9px;
    }

    .cover-badge {
      display: inline-block;
      background: #f59e0b;
      color: white;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 7px;
    }

    .empty {
      color: #777;
      padding: 15px;
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-modal {
      border: 0;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
    }

    .selected-file {
      margin-top: 8px;
      font-size: 13px;
      color: #555;
      word-break: break-word;
    }

    .upload-progress {
      height: 8px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
      display: none;
    }

    .upload-progress-bar {
      height: 100%;
      width: 0%;
      background: #16803c;
      transition: width .2s;
    }

    .logout {
      float: right;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #777;
    }

    @media (max-width: 700px) {

      body {
        padding: 10px;
      }

      .category-row {
        flex-direction: column;
        align-items: stretch;
      }

      .category-actions {
        justify-content: flex-start;
      }

      .children {
        margin-left: 10px;
      }

      .photo-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 430px) {

      .photo-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <button
      id="logout-btn"
      class="btn btn-red logout"
      style="display:none;"
    >
      Logout
    </button>

    <h1>ReyCreate Studio</h1>
    <p>Portfolio Administration</p>
  </header>


  <!-- LOGIN -->

  <div id="login-section" class="login-box">

    <h2>Admin Login</h2>

    <div id="login-status" class="status"></div>

    <form id="login-form">

      <div class="form-group">
        <label>Email</label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button
        type="submit"
        class="btn btn-primary"
      >
        Login
      </button>

    </form>

  </div>


  <!-- ADMIN -->

  <div
    id="admin-section"
    class="admin-panel"
    style="display:none;"
  >

    <div id="admin-status" class="status"></div>

    <div class="toolbar">

      <button
        id="add-category-btn"
        class="btn btn-primary"
      >
        + Add Category
      </button>

      <button
        id="refresh-btn"
        class="btn btn-gray"
      >
        ↻ Refresh
      </button>

      <a
        href="index.html#portfolio"
        target="_blank"
        class="btn btn-blue"
      >
        View Portfolio
      </a>

    </div>

    <h2>Portfolio Categories</h2>

    <div
      id="category-tree"
      class="category-tree"
    >
      <div class="loading">
        Loading portfolio...
      </div>
    </div>

  </div>

</div>


<!-- PHOTO MODAL -->

<div
  id="photo-modal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>Add Photo</h2>

      <button
        id="close-photo-modal"
        class="close-modal"
        type="button"
      >
        &times;
      </button>

    </div>

    <div id="photo-status" class="status"></div>

    <form id="photo-form">

      <div class="form-group">

        <label>Choose Image</label>

        <input
          id="photo-file"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/gif"
          required
        >

        <div
          id="selected-file"
          class="selected-file"
        ></div>

      </div>


      <div class="form-group">

        <label>Photo Title</label>

        <input
          id="photo-title"
          type="text"
          required
          placeholder="Example: Wedding Ceremony"
        >

      </div>


      <div class="form-group">

        <label>Description</label>

        <textarea
          id="photo-description"
          placeholder="Optional description"
        ></textarea>

      </div>


      <div class="upload-progress">

        <div
          id="upload-progress-bar"
          class="upload-progress-bar"
        ></div>

      </div>


      <button
        id="upload-photo-btn"
        type="submit"
        class="btn btn-green"
      >
        Upload Photo
      </button>

      <button
        id="cancel-photo-btn"
        type="button"
        class="btn btn-gray"
      >
        Cancel
      </button>

    </form>

  </div>

</div>


<!-- EDIT PHOTO MODAL -->

<div
  id="edit-photo-modal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>Edit Photo</h2>

      <button
        id="close-edit-photo-modal"
        class="close-modal"
        type="button"
      >
        &times;
      </button>

    </div>

    <div id="edit-photo-status" class="status"></div>

    <form id="edit-photo-form">

      <input
        id="edit-photo-id"
        type="hidden"
      >

      <div class="form-group">

        <label>Photo Title</label>

        <input
          id="edit-photo-title"
          type="text"
          required
        >

      </div>

      <div class="form-group">

        <label>Description</label>

        <textarea
          id="edit-photo-description"
        ></textarea>

      </div>

      <div class="form-group">

        <label>Replace Image</label>

        <input
          id="edit-photo-file"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/gif"
        >

      </div>

      <button
        type="submit"
        class="btn btn-green"
      >
        Save Changes
      </button>

      <button
        id="cancel-edit-photo-btn"
        type="button"
        class="btn btn-gray"
      >
        Cancel
      </button>

    </form>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    getDoc,
    doc,
    updateDoc,
    deleteDoc,
    query,
    orderBy,
    where,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

  import {
    getStorage,
    ref,
    uploadBytesResumable,
    getDownloadURL,
    deleteObject
  } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-storage.js";


  /* =========================================
     FIREBASE CONFIG
  ========================================= */

  const firebaseConfig = {

    apiKey: "AIzaSyBlbeyeynUXvrSE-TBVjwaEiBobHTrBlQo",

    authDomain:
      "reycreatestudio-portfoli-9b09b.firebaseapp.com",

    projectId:
      "reycreatestudio-portfoli-9b09b",

    storageBucket:
      "reycreatestudio-portfoli-9b09b.firebasestorage.app",

    messagingSenderId:
      "41750977632",

    appId:
      "1:41750977632:web:f202e8614f20e5d9ceb705"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);

  const storage = getStorage(app);


  /* =========================================
     ELEMENTS
  ========================================= */

  const loginSection =
    document.getElementById("login-section");

  const adminSection =
    document.getElementById("admin-section");

  const loginForm =
    document.getElementById("login-form");

  const logoutBtn =
    document.getElementById("logout-btn");

  const categoryTree =
    document.getElementById("category-tree");

  const addCategoryBtn =
    document.getElementById("add-category-btn");

  const refreshBtn =
    document.getElementById("refresh-btn");

  const photoModal =
    document.getElementById("photo-modal");

  const editPhotoModal =
    document.getElementById("edit-photo-modal");

  let categories = [];

  let photos = [];

  let currentPhotoCategoryId = null;


  /* =========================================
     STATUS
  ========================================= */

  function showStatus(element, message, type = "info") {

    element.textContent = message;

    element.className =
      "status show " + type;

  }


  function hideStatus(element) {

    element.className = "status";

    element.textContent = "";

  }


  /* =========================================
     LOGIN
  ========================================= */

  loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const status =
      document.getElementById("login-status");

    try {

      showStatus(
        status,
        "Logging in...",
        "info"
      );

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      hideStatus(status);

    } catch (error) {

      console.error(error);

      showStatus(
        status,
        error.message,
        "error"
      );

    }

  });


  logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

  });


  onAuthStateChanged(auth, async (user) => {

    if (user) {

      loginSection.style.display = "none";

      adminSection.style.display = "block";

      logoutBtn.style.display = "block";

      await loadPortfolio();

    } else {

      loginSection.style.display = "block";

      adminSection.style.display = "none";

      logoutBtn.style.display = "none";

    }

  });


  /* =========================================
     LOAD PORTFOLIO
  ========================================= */

  async function loadPortfolio() {

    const status =
      document.getElementById("admin-status");

    try {

      categoryTree.innerHTML =
        '<div class="loading">Loading...</div>';

      const categorySnapshot =
        await getDocs(
          query(
            collection(db, "portfolio_categories"),
            orderBy("sortOrder")
          )
        );

      categories =
        categorySnapshot.docs.map(item => ({
          id: item.id,
          ...item.data()
        }));


      const photoSnapshot =
        await getDocs(
          query(
            collection(db, "portfolio_photos"),
            orderBy("sortOrder")
          )
        );

      photos =
        photoSnapshot.docs.map(item => ({
          id: item.id,
          ...item.data()
        }));


      renderCategories();

      hideStatus(status);

    } catch (error) {

      console.error(error);

      showStatus(
        status,
        "Error loading portfolio: " +
        error.message,
        "error"
      );

      categoryTree.innerHTML =
        '<div class="empty">Unable to load portfolio.</div>';

    }

  }


  refreshBtn.addEventListener(
    "click",
    loadPortfolio
  );


  /* =========================================
     CATEGORY TREE
  ========================================= */

  function getChildren(parentId) {

    return categories
      .filter(category =>
        (category.parentId || null) === parentId
      )
      .sort(
        (a, b) =>
          (a.sortOrder || 0) -
          (b.sortOrder || 0)
      );

  }


  function renderCategories() {

    categoryTree.innerHTML = "";

    const roots =
      getChildren(null);

    if (!roots.length) {

      categoryTree.innerHTML =
        '<div class="empty">No categories yet.</div>';

      return;

    }

    roots.forEach(category => {

      categoryTree.appendChild(
        createCategoryElement(category)
      );

    });

  }


  function createCategoryElement(category) {

    const wrapper =
      document.createElement("div");

    wrapper.className = "category-item";


    const row =
      document.createElement("div");

    row.className = "category-row";


    const info =
      document.createElement("div");

    info.className = "category-info";


    const name =
      document.createElement("div");

    name.className = "category-name";

    name.textContent =
      category.name || "Untitled";


    const meta =
      document.createElement("div");

    meta.className = "category-meta";

    const photoCount =
      photos.filter(
        photo =>
          photo.categoryId === category.id
      ).length;

    const childCount =
      categories.filter(
        item =>
          item.parentId === category.id
      ).length;

    meta.innerHTML =
      `${photoCount} photo(s) • ` +
      `${childCount} subcategory(ies)`;


    if (category.visible === false) {

      meta.innerHTML +=
        ' • <span class="hidden-label">Hidden</span>';

    }


    info.appendChild(name);

    info.appendChild(meta);


    const actions =
      document.createElement("div");

    actions.className =
      "category-actions";


    const photoBtn =
      makeButton(
        "Photos",
        "btn btn-green"
      );

    photoBtn.addEventListener(
      "click",
      () => openPhotoManager(category.id)
    );


    const subBtn =
      makeButton(
        "+ Subcategory",
        "btn btn-blue"
      );

    subBtn.addEventListener(
      "click",
      () => addCategory(category.id)
    );


    const renameBtn =
      makeButton(
        "Rename",
        "btn btn-gray"
      );

    renameBtn.addEventListener(
      "click",
      () => renameCategory(category)
    );


    const visibilityBtn =
      makeButton(
        category.visible === false
          ? "Show"
          : "Hide",
        "btn btn-orange"
      );

    visibilityBtn.addEventListener(
      "click",
      () => toggleCategoryVisibility(category)
    );


    const deleteBtn =
      makeButton(
        "Delete",
        "btn btn-red"
      );

    deleteBtn.addEventListener(
      "click",
      () => deleteCategory(category)
    );


    actions.appendChild(photoBtn);

    actions.appendChild(subBtn);

    actions.appendChild(renameBtn);

    actions.appendChild(visibilityBtn);

    actions.appendChild(deleteBtn);


    row.appendChild(info);

    row.appendChild(actions);


    wrapper.appendChild(row);


    const children =
      getChildren(category.id);


    if (children.length) {

      const childContainer =
        document.createElement("div");

      childContainer.className =
        "children";

      children.forEach(child => {

        childContainer.appendChild(
          createCategoryElement(child)
        );

      });

      wrapper.appendChild(
        childContainer
      );

    }


    return wrapper;

  }


  function makeButton(text, className) {

    const button =
      document.createElement("button");

    button.type = "button";

    button.textContent = text;

    button.className = className;

    return button;

  }


  /* =========================================
     ADD CATEGORY
  ========================================= */

  addCategoryBtn.addEventListener(
    "click",
    () => addCategory(null)
  );


  async function addCategory(parentId) {

    const name =
      prompt(
        parentId
          ? "Subcategory name:"
          : "Category name:"
      );

    if (!name || !name.trim()) {
      return;
    }


    try {

      const siblings =
        getChildren(parentId);

      await addDoc(
        collection(
          db,
          "portfolio_categories"
        ),
        {
          name: name.trim(),
          description: "",
          parentId: parentId || null,
          sortOrder: siblings.length,
          visible: true,
          createdAt: serverTimestamp()
        }
      );

      await loadPortfolio();

    } catch (error) {

      console.error(error);

      alert(
        "Error creating category:\n" +
        error.message
      );

    }

  }


  /* =========================================
     RENAME CATEGORY
  ========================================= */

  async function renameCategory(category) {

    const name =
      prompt(
        "New category name:",
        category.name
      );

    if (!name || !name.trim()) {
      return;
    }


    try {

      await updateDoc(
        doc(
          db,
          "portfolio_categories",
          category.id
        ),
        {
          name: name.trim()
        }
      );

      await loadPortfolio();

    } catch (error) {

      alert(
        "Error renaming category:\n" +
        error.message
      );

    }

  }


  /* =========================================
     CATEGORY VISIBILITY
  ========================================= */

  async function toggleCategoryVisibility(category) {

    try {

      await updateDoc(
        doc(
          db,
          "portfolio_categories",
          category.id
        ),
        {
          visible:
            category.visible === false
        }
      );

      await loadPortfolio();

    } catch (error) {

      alert(
        "Error changing visibility:\n" +
        error.message
      );

    }

  }


  /* =========================================
     DELETE CATEGORY
  ========================================= */

  async function deleteCategory(category) {

    const children =
      categories.filter(
        item =>
          item.parentId === category.id
      );

    const categoryPhotos =
      photos.filter(
        photo =>
          photo.categoryId === category.id
      );


    if (children.length) {

      alert(
        "This category contains subcategories.\n\n" +
        "Delete or move the subcategories first."
      );

      return;

    }


    if (categoryPhotos.length) {

      alert(
        "This category still contains photos.\n\n" +
        "Delete the photos first."
      );

      return;

    }


    const confirmed =
      confirm(
        `Delete "${category.name}"?`
      );

    if (!confirmed) {
      return;
    }


    try {

      await deleteDoc(
        doc(
          db,
          "portfolio_categories",
          category.id
        )
      );

      await loadPortfolio();

    } catch (error) {

      alert(
        "Error deleting category:\n" +
        error.message
      );

    }

  }


  /* =========================================
     PHOTO MANAGER
  ========================================= */

  function openPhotoManager(categoryId) {

    currentPhotoCategoryId =
      categoryId;

    const category =
      categories.find(
        item =>
          item.id === categoryId
      );

    if (!category) {
      return;
    }


    renderPhotoManager(category);

  }


  function renderPhotoManager(category) {

    const existing =
      document.getElementById(
        "photo-manager-" + category.id
      );

    if (existing) {

      existing.remove();

      return;

    }


    const container =
      document.createElement("div");

        )

        );

        document.createElement("div");

  function findCategoryElement(categoryId) {

    return document.querySelector(

  function findCategoryByText(categoryId) {

    const all =

        ".category-item"
      );

    for (const element of all) {

      if (
        element.dataset.categoryId ===
        categoryId
      ) {

        return element;

      }

    }

    return null;

  }

  /* =========================================
     UPLOAD PHOTO
  ========================================= */

  document.getElementById(
    "photo-form"
  ).addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const file =
        document.getElementById(
          "photo-file"
        ).files[0];

      const title =
        document.getElementById(
          "photo-title"
        ).value.trim();

      const description =
        document.getElementById(
          "photo-description"
        ).value.trim();


      if (!file) {

        alert(
          "Please choose an image."
        );

        return;

      }


      if (!title) {

        alert(
          "Please enter a photo title."
        );

        return;

      }


      const photoStatus =
        document.getElementById(
          "photo-status"
        );

      const uploadButton =
        document.getElementById(
          "upload-photo-btn"
        );


      try {

        uploadButton.disabled = true;

        showStatus(
          photoStatus,
          "Uploading image...",
          "info"
        );


        const safeName =
          sanitizeFilename(
            file.name
          );


        const uniqueName =
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2, 8) +
          "_" +
          safeName;


        const storagePath =
          `portfolio/${currentPhotoCategoryId}/${uniqueName}`;


        const storageRef =
          ref(
            storage,
            storagePath
          );


        const uploadTask =
          uploadBytesResumable(
            storageRef,
            file,
            {
              contentType:
                file.type
            }
          );


        uploadTask.on(
          "state_changed",

          snapshot => {

            const progress =
              (
                snapshot.bytesTransferred /
                snapshot.totalBytes
              ) * 100;


            document.getElementById(
              "upload-progress-bar"
            ).style.width =
              progress + "%";

          },

          error => {

            console.error(error);

            showStatus(
              photoStatus,
              "Upload failed: " +
              error.message,
              "error"
            );

            uploadButton.disabled =
              false;

          },

          async () => {

            const imageUrl =
              await getDownloadURL(
                uploadTask.snapshot.ref
              );


            const categoryPhotos =
              photos.filter(
                photo =>
                  photo.categoryId ===
                  currentPhotoCategoryId
              );


            await addDoc(
              collection(
                db,
                "portfolio_photos"
              ),
              {
                categoryId:
                  currentPhotoCategoryId,

                title,

                description,

                imageUrl,

                storagePath,

                sortOrder:
                  categoryPhotos.length,

                isCover:
                  categoryPhotos.length === 0,

                visible:
                  true,

                createdAt:
                  serverTimestamp()
              }
            );


            showStatus(
              photoStatus,
              "Photo uploaded successfully!",
              "success"
            );


            await loadPortfolio();


            setTimeout(
              () => {

                closePhotoModal();

              },
              700
            );

          }
        );

      } catch (error) {

        console.error(error);

        showStatus(
          photoStatus,
          error.message,
          "error"
        );

        uploadButton.disabled =
          false;

      }

    }
  );

          await deleteObject(
            ref(
              storage,
              photo.storagePath
            )
          );

        } catch (storageError) {

          console.warn(

      await deleteDoc(
        doc(
          db,

          photo.id

    }

  /* =========================================
     HELPERS
  ========================================= */

  function sanitizeFilename(filename) {

    return filename
      .replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );

  }


  function formatBytes(bytes) {

    if (!bytes) {
      return "0 Bytes";
    }

    const sizes =
      [
        "Bytes",
        "KB",
        "MB",
        "GB"
      ];

    const i =
      Math.floor(
        Math.log(bytes) /
        Math.log(1024)
      );

    return (
      parseFloat(
        (
          bytes /
          Math.pow(1024, i)
        ).toFixed(2)
      ) +
      " " +
      sizes[i]
    );

  }


  function escapeHtml(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

  /* Rebuild child IDs */

  function applyCategoryIds() {

    const elements =
      document.querySelectorAll(
        ".category-item"
      );

    const assign =
      (element, category) => {

        element.dataset.categoryId =
          category.id;


        const children =
          getChildren(category.id);


        const childElements =
          element.querySelectorAll(
            ":scope > .children > .category-item"
          );


        childElements.forEach(
          (childElement, index) => {

            if (children[index]) {

              assign(
                childElement,
                children[index]
              );

            }

          }
        );

      };


    const rootElements =
      categoryTree.querySelectorAll(
        ":scope > .category-item"
      );


    rootElements.forEach(
      (element, index) => {

        if (rootsExist(index)) {

          const roots =
            getChildren(null);

          assign(
            element,
            roots[index]
          );

        }

      }
    );

  }


  function rootsExist(index) {

    return getChildren(null)[index] != null;

  }

  function renderCategories() {

  categoryTree.innerHTML = "";

}

    );

    () => deleteCategory(category);


  actions.appendChild(photoBtn);

  actions.appendChild(subBtn);

  actions.appendChild(renameBtn);

  actions.appendChild(visibilityBtn);

  actions.appendChild(deleteBtn);


  row.appendChild(info);

  row.appendChild(actions);

  const children =

    children.forEach(child => {

      );

    });

    );

  }


  return wrapper;

}
