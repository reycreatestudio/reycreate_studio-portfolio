<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ReyCreate Studio | Admin</title>


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }


        /* =========================
           LOGIN
        ========================= */

        #login-section {
            width: min(420px, 92%);
            margin: 100px auto;
            background: #fff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        }

        #login-section h1 {
            margin: 0 0 8px;
        }

        .login-subtitle {
            color: #666;
            margin: 0 0 25px;
        }

        #login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #login-form input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        #login-form input:focus {
            border-color: #111;
        }

        #login-form button {
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #111;
            color: #fff;
        }

        #login-form button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #login-message {
            margin-top: 15px;
            word-break: break-word;
        }


        /* =========================
           ADMIN
        ========================= */

        #admin-section {
            width: min(1150px, 94%);
            margin: 30px auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;

            background: #fff;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .admin-header h1 {
            margin: 0 0 5px;
        }

        .admin-header p {
            margin: 0;
            color: #777;
        }

        #logout-button {
            border: 0;
            background: #111;
            color: #fff;
            padding: 11px 18px;
            border-radius: 8px;
        }


        /* =========================
           PANELS
        ========================= */

        .admin-panel {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
        }

        .panel-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .panel-heading h2 {
            margin: 0;
        }

        #add-category,
        #add-photo {
            border: 0;
            background: #111;
            color: #fff;
            padding: 11px 16px;
            border-radius: 8px;
        }


        /* =========================
           CATEGORY TREE
        ========================= */

        #category-manager {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .category-row {
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 15px;
            background: #fafafa;
        }

        .category-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .category-name {
            font-weight: 600;
        }

        .category-info {
            color: #777;
            font-size: 13px;
            margin-top: 4px;
        }

        .category-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .category-actions button {
            border: 0;
            padding: 8px 11px;
            border-radius: 6px;
            background: #e9e9e9;
        }

        .category-actions .delete-button {
            color: #b00020;
        }

        .children {
            margin-top: 10px;
            margin-left: 25px;
            padding-left: 15px;
            border-left: 2px solid #ddd;

            display: flex;
            flex-direction: column;
            gap: 10px;
        }


        /* =========================
           PHOTO MANAGER
        ========================= */

        #photo-manager {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
        }

        .photo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .photo-header h2 {
            margin: 0 0 5px;
        }

        .photo-header p {
            margin: 0;
            color: #777;
            font-size: 13px;
        }

        #back-to-categories {
            border: 0;
            padding: 10px 15px;
            border-radius: 8px;
            background: #eee;
        }


        /* =========================
           PHOTO GRID
        ========================= */

        #photo-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(220px, 1fr));

            gap: 20px;
        }

        .photo-card {
            overflow: hidden;
            background: #fafafa;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
        }

        .photo-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #eee;
        }

        .photo-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-badge {
            position: absolute;
            top: 10px;
            left: 10px;

            background: #111;
            color: #fff;

            padding: 6px 9px;
            border-radius: 6px;

            font-size: 12px;
        }

        .photo-info {
            padding: 14px;
        }

        .photo-title {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .photo-description {
            font-size: 13px;
            color: #777;
            margin-bottom: 12px;
        }

        .photo-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .photo-actions button {
            border: 0;
            padding: 8px 10px;
            border-radius: 6px;
            background: #e9e9e9;
        }

        .photo-actions .delete-photo {
            color: #b00020;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            #admin-section {
                width: 94%;
                margin: 15px auto;
            }

            .admin-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .panel-heading {
                align-items: stretch;
                flex-direction: column;
            }

            .category-content {
                align-items: flex-start;
                flex-direction: column;
            }

            .category-actions {
                width: 100%;
            }

            .category-actions button {
                flex: 1;
            }

            #photo-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         LOGIN
    ====================================================== -->

    <section id="login-section">

        <h1>
            ReyCreate Studio
        </h1>

        <p class="login-subtitle">
            Portfolio Administration
        </p>


        <form id="login-form">

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                id="login-button"
            >
                Login
            </button>

        </form>


        <p id="login-message"></p>

    </section>



    <!-- =====================================================
         ADMIN DASHBOARD
    ====================================================== -->

    <section
        id="admin-section"
        hidden
    >

        <header class="admin-header">

            <div>

                <h1>
                    Portfolio Manager
                </h1>

                <p>
                    ReyCreate Studio
                </p>

            </div>


            <button id="logout-button">
                Logout
            </button>

        </header>



        <!-- =================================================
             CATEGORY MANAGER
        ================================================== -->

        <section
            class="admin-panel"
            id="category-panel"
        >

            <div class="panel-heading">

                <h2>
                    Categories
                </h2>

                <button id="add-category">
                    + Add Category
                </button>

            </div>


            <div id="category-manager">

                <p>
                    Loading categories...
                </p>

            </div>

        </section>



        <!-- =================================================
             PHOTO MANAGER
        ================================================== -->

        <section
            id="photo-manager"
            hidden
        >

            <div class="photo-header">

                <button id="back-to-categories">
                    ← Categories
                </button>


                <div>

                    <h2 id="current-category-name">
                        Photos
                    </h2>

                    <p id="current-category-path">
                    </p>

                </div>


                <button id="add-photo">
                    + Add Photo
                </button>

            </div>


            <div id="photo-grid">

                <p>
                    No photos yet.
                </p>

            </div>

        </section>

    </section>



    <!-- =====================================================
         FIREBASE + ADMIN SYSTEM
    ====================================================== -->

    <script type="module">

        /* =====================================================
           FIREBASE IMPORTS
        ====================================================== */

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";


        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        }
        from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


        import {
            getFirestore,
            collection,
            getDocs,
            addDoc,
            updateDoc,
            deleteDoc,
            doc,
            query,
            orderBy,
            serverTimestamp
        }
        from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";



        /* =====================================================
           FIREBASE CONFIG
        ====================================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyBlBleyeynUXvrSE-TBVjwaEiBobHTrBlQo",

            authDomain:
                "reycreatestudio-portfoli-9b09b.firebaseapp.com",

            projectId:
                "reycreatestudio-portfoli-9b09b",

            storageBucket:
                "reycreatestudio-portfoli-9b09b.firebasestorage.app",

            messagingSenderId:
                "41750977632",

            appId:
                "1:41750977632:web:f202e8614f20e5d9ceb705"

        };


        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);



        /* =====================================================
           ELEMENTS
        ====================================================== */

        const loginSection =
            document.getElementById(
                "login-section"
            );


        const adminSection =
            document.getElementById(
                "admin-section"
            );


        const categoryPanel =
            document.getElementById(
                "category-panel"
            );


        const loginForm =
            document.getElementById(
                "login-form"
            );


        const loginButton =
            document.getElementById(
                "login-button"
            );


        const loginMessage =
            document.getElementById(
                "login-message"
            );


        const logoutButton =
            document.getElementById(
                "logout-button"
            );


        const addCategoryButton =
            document.getElementById(
                "add-category"
            );


        const categoryManager =
            document.getElementById(
                "category-manager"
            );


        const photoManager =
            document.getElementById(
                "photo-manager"
            );


        const backToCategories =
            document.getElementById(
                "back-to-categories"
            );


        const addPhotoButton =
            document.getElementById(
                "add-photo"
            );


        const photoGrid =
            document.getElementById(
                "photo-grid"
            );


        const currentCategoryName =
            document.getElementById(
                "current-category-name"
            );


        const currentCategoryPath =
            document.getElementById(
                "current-category-path"
            );



        /* =====================================================
           CURRENT CATEGORY
        ====================================================== */

        let currentCategoryId = null;

        let currentCategory = null;



        /* =====================================================
           LOGIN
        ====================================================== */

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                loginButton.disabled =
                    true;


                loginMessage.textContent =
                    "Logging in...";


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                    loginMessage.textContent =
                        "";

                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    loginMessage.textContent =
                        error.code +
                        " — " +
                        error.message;

                } finally {

                    loginButton.disabled =
                        false;

                }

            }
        );



        /* =====================================================
           LOGOUT
        ====================================================== */

        logoutButton.addEventListener(
            "click",
            async () => {

                try {

                    await signOut(auth);

                } catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                }

            }
        );



        /* =====================================================
           AUTH STATE
        ====================================================== */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (user) {

                    console.log(
                        "Admin logged in:",
                        user.email
                    );


                    loginSection.hidden =
                        true;


                    adminSection.hidden =
                        false;


                    await loadCategories();

                } else {

                    loginSection.hidden =
                        false;


                    adminSection.hidden =
                        true;

                }

            }
        );



        /* =====================================================
           ADD ROOT CATEGORY
        ====================================================== */

        addCategoryButton.addEventListener(
            "click",
            async () => {

                const name =
                    prompt(
                        "Enter category name:"
                    );


                if (
                    !name ||
                    !name.trim()
                ) {

                    return;

                }


                try {

                    await addDoc(
                        collection(
                            db,
                            "portfolio_categories"
                        ),
                        {

                            name:
                                name.trim(),

                            description:
                                "",

                            parentId:
                                null,

                            sortOrder:
                                Date.now(),

                            visible:
                                true,

                            createdAt:
                                serverTimestamp()

                        }
                    );


                    await loadCategories();


                } catch (error) {

                    console.error(
                        error
                    );


                    alert(
                        "Unable to create category:\n\n" +
                        error.message
                    );

                }

            }
        );



        /* =====================================================
           LOAD CATEGORIES
        ====================================================== */

        async function loadCategories() {

            categoryManager.innerHTML =
                "<p>Loading categories...</p>";


            try {

                const categoryQuery =
                    query(
                        collection(
                            db,
                            "portfolio_categories"
                        ),
                        orderBy(
                            "sortOrder"
                        )
                    );


                const snapshot =
                    await getDocs(
                        categoryQuery
                    );


                const categories = [];


                snapshot.forEach(
                    item => {

                        categories.push({

                            id:
                                item.id,

                            ...item.data()

                        });

                    }
                );


                categoryManager.innerHTML =
                    "";


                if (
                    categories.length === 0
                ) {

                    categoryManager.innerHTML =
                        "<p>No categories yet. Click + Add Category.</p>";

                    return;

                }


                const tree =
                    buildTree(
                        categories,
                        null
                    );


                renderTree(
                    tree,
                    categoryManager
                );


            } catch (error) {

                console.error(
                    "Category error:",
                    error
                );


                categoryManager.innerHTML =
                    "<p>Unable to load categories.</p>";


                alert(
                    "Firestore error:\n\n" +
                    error.message
                );

            }

        }



        /* =====================================================
           BUILD CATEGORY TREE
        ====================================================== */

        function buildTree(
            categories,
            parentId
        ) {

            return categories

                .filter(
                    category =>
                        (
                            category.parentId ||
                            null
                        ) === parentId
                )

                .map(
                    category => ({

                        ...category,

                        children:
                            buildTree(
                                categories,
                                category.id
                            )

                    })
                );

        }



        /* =====================================================
           RENDER CATEGORY TREE
        ====================================================== */

        function renderTree(
            categories,
            container
        ) {

            categories.forEach(
                category => {

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "category-row";


                    const content =
                        document.createElement(
                            "div"
                        );


                    content.className =
                        "category-content";


                    const information =
                        document.createElement(
                            "div"
                        );


                    const name =
                        document.createElement(
                            "div"
                        );


                    name.className =
                        "category-name";


                    name.textContent =
                        "📁 " +
                        category.name;


                    const info =
                        document.createElement(
                            "div"
                        );


                    info.className =
                        "category-info";


                    const childCount =
                        category.children.length;


                    info.textContent =
                        childCount +
                        (
                            childCount === 1
                                ? " subcategory"
                                : " subcategories"
                        );


                    information.appendChild(
                        name
                    );


                    information.appendChild(
                        info
                    );



                    const actions =
                        document.createElement(
                            "div"
                        );


                    actions.className =
                        "category-actions";



                    /* =========================
                       PHOTOS
                    ========================= */

                    const photosButton =
                        document.createElement(
                            "button"
                        );


                    photosButton.textContent =
                        "Photos";


                    photosButton.addEventListener(
                        "click",
                        () =>
                            openPhotoManager(
                                category
                            )
                    );


                    actions.appendChild(
                        photosButton
                    );



                    /* =========================
                       SUBCATEGORY
                    ========================= */

                    const addChild =
                        document.createElement(
                            "button"
                        );


                    addChild.textContent =
                        "+ Subcategory";


                    addChild.addEventListener(
                        "click",
                        () =>
                            addSubcategory(
                                category.id
                            )
                    );


                    actions.appendChild(
                        addChild
                    );



                    /* =========================
                       RENAME
                    ========================= */

                    const rename =
                        document.createElement(
                            "button"
                        );


                    rename.textContent =
                        "Rename";


                    rename.addEventListener(
                        "click",
                        () =>
                            renameCategory(
                                category
                            )
                    );


                    actions.appendChild(
                        rename
                    );



                    /* =========================
                       DELETE
                    ========================= */

                    const deleteButton =
                        document.createElement(
                            "button"
                        );


                    deleteButton.textContent =
                        "Delete";


                    deleteButton.className =
                        "delete-button";


                    deleteButton.addEventListener(
                        "click",
                        () =>
                            deleteCategory(
                                category
                            )
                    );


                    actions.appendChild(
                        deleteButton
                    );



                    content.appendChild(
                        information
                    );


                    content.appendChild(
                        actions
                    );


                    row.appendChild(
                        content
                    );



                    /* =========================
                       CHILDREN
                    ========================= */

                    if (
                        category.children &&
                        category.children.length
                    ) {

                        const children =
                            document.createElement(
                                "div"
                            );


                        children.className =
                            "children";


                        renderTree(
                            category.children,
                            children
                        );


                        row.appendChild(
                            children
                        );

                    }


                    container.appendChild(
                        row
                    );

                }
            );

        }



        /* =====================================================
           ADD SUBCATEGORY
        ====================================================== */

        async function addSubcategory(
            parentId
        ) {

            const name =
                prompt(
                    "Enter subcategory name:"
                );


            if (
                !name ||
                !name.trim()
            ) {

                return;

            }


            try {

                await addDoc(
                    collection(
                        db,
                        "portfolio_categories"
                    ),
                    {

                        name:
                            name.trim(),

                        description:
                            "",

                        parentId:
                            parentId,

                        sortOrder:
                            Date.now(),

                        visible:
                            true,

                        createdAt:
                            serverTimestamp()

                    }
                );


                await loadCategories();


            } catch (error) {

                console.error(
                    error
                );


                alert(
                    "Unable to create subcategory:\n\n" +
                    error.message
                );

            }

        }



        /* =====================================================
           RENAME CATEGORY
        ====================================================== */

        async function renameCategory(
            category
        ) {

            const newName =
                prompt(
                    "Enter new name:",
                    category.name
                );


            if (
                !newName ||
                !newName.trim() ||
                newName.trim() ===
                category.name
            ) {

                return;

            }


            try {

                await updateDoc(
                    doc(
                        db,
                        "portfolio_categories",
                        category.id
                    ),
                    {

                        name:
                            newName.trim()

                    }
                );


                await loadCategories();


            } catch (error) {

                console.error(
                    error
                );


                alert(
                    "Unable to rename category:\n\n" +
                    error.message
                );

            }

        }



        /* =====================================================
           DELETE CATEGORY
        ====================================================== */

        async function deleteCategory(
            category
        ) {

            const confirmed =
                confirm(
                    "Delete \"" +
                    category.name +
                    "\"?\n\n" +
                    "This deletes the category only. " +
                    "Subcategories and photos are not automatically deleted."
                );


            if (!confirmed) {

                return;

            }


            try {

                await deleteDoc(
                    doc(
                        db,
                        "portfolio_categories",
                        category.id
                    )
                );


                await loadCategories();


            } catch (error) {

                console.error(
                    error
                );


                alert(
                    "Unable to delete category:\n\n" +
                    error.message
                );

            }

        }



        /* =====================================================
           OPEN PHOTO MANAGER
        ====================================================== */

        async function openPhotoManager(
            category
        ) {

            currentCategoryId =
                category.id;


            currentCategory =
                category;


            categoryPanel.hidden =
                true;


            photoManager.hidden =
                false;


            currentCategoryName.textContent =
                category.name;


            currentCategoryPath.textContent =
                "Portfolio / " +
                category.name;


            await loadPhotos();

        }



        /* =====================================================
           BACK TO CATEGORIES
        ====================================================== */

        backToCategories.addEventListener(
            "click",
            () => {

                photoManager.hidden =
                    true;


                categoryPanel.hidden =
                    false;

            }
        );



        /* =====================================================
           LOAD PHOTOS
        ====================================================== */

        async function loadPhotos() {

            photoGrid.innerHTML =
                "<p>Loading photos...</p>";


            try {

                const photoQuery =
                    query(
                        collection(
                            db,
                            "portfolio_photos"
                        ),
                        orderBy(
                            "sortOrder"
                        )
                    );


                const snapshot =
                    await getDocs(
                        photoQuery
                    );


                const photos = [];


                snapshot.forEach(
                    item => {

                        const data =
                            item.data();


                        if (
                            data.categoryId ===
                            currentCategoryId
                        ) {

                            photos.push({

                                id:
                                    item.id,

                                ...data

                            });

                        }

                    }
                );


                photoGrid.innerHTML =
                    "";


                if (
                    photos.length === 0
                ) {

                    photoGrid.innerHTML =
                        "<p>No photos yet. Click + Add Photo.</p>";

                    return;

                }


                photos.forEach(
                    photo => {

                        renderPhoto(
                            photo
                        );

                    }
                );


            } catch (error) {

                console.error(
                    error
                );


                photoGrid.innerHTML =
                    "<p>Unable to load photos.</p>";


                alert(
                    "Photo loading error:\n\n" +
                    error.message
                );

            }

        }



        /* =====================================================
           RENDER PHOTO
        ====================================================== */

        function renderPhoto(
            photo
        ) {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "photo-card";


            const imageWrapper =
                document.createElement(
                    "div"
                );


            imageWrapper.className =
                "photo-image-wrapper";


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                photo.imageUrl;


            image.alt =
                photo.title ||
                "Portfolio photo";


            image.loading =
                "lazy";


            image.onerror =
                () => {

                    image.style.display =
                        "none";


                    const errorText =
                        document.createElement(
                            "p"
                        );


                    errorText.textContent =
                        "Image not found";


                    errorText.style.padding =
                        "20px";


                    imageWrapper.appendChild(
                        errorText
                    );

                };


            imageWrapper.appendChild(
                image
            );



            /* COVER */

            if (
                photo.isCover
            ) {

                const badge =
                    document.createElement(
                        "div"
                    );


                badge.className =
                    "cover-badge";


                badge.textContent =
                    "⭐ COVER";


                imageWrapper.appendChild(
                    badge
                );

            }



            /* INFO */

            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "photo-info";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "photo-title";


            title.textContent =
                photo.title ||
                "Untitled";



            const description =
                document.createElement(
                    "div"
                );


            description.className =
                "photo-description";


            description.textContent =
                photo.description ||
                "";



            /* ACTIONS */

            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "photo-actions";



            if (
                !photo.isCover
            ) {

                const coverButton =
                    document.createElement(
                        "button"
                    );


                coverButton.textContent =
                    "Set Cover";


                coverButton.addEventListener(
                    "click",
                    () =>
                        setCover(
                            photo.id
                        )
                );


                actions.appendChild(
                    coverButton
                );

            }



            /* EDIT */

            const editButton =
                document.createElement(
                    "button"
                );


            editButton.textContent =
                "Edit";


            editButton.addEventListener(
                "click",
                () =>
                    editPhoto(
                        photo
                    )
            );


            actions.appendChild(
                editButton
            );



            /* DELETE */

            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.textContent =
                "Delete";


            deleteButton.className =
                "delete-photo";


            deleteButton.addEventListener(
                "click",
                () =>
                    deletePhoto(
                        photo
                    )
            );


            actions.appendChild(
                deleteButton
            );



            info.appendChild(
                title
            );


            info.appendChild(
                description
            );


            info.appendChild(
                actions
            );


            card.appendChild(
                imageWrapper
            );


            card.appendChild(
                info
            );


            photoGrid.appendChild(
                card
            );

        }



        /* =====================================================
           ADD PHOTO
        ====================================================== */

        addPhotoButton.addEventListener(
            "click",
            async () => {

                const title =
                    prompt(
                        "Photo title:"
                    );


                if (
                    !title ||
                    !title.trim()
                ) {

                    return;

                }


                const imageUrl =
                    prompt(
                        "GitHub image URL:\n\nExample:\nhttps://reycreatestudio.github.io/reycreate_studio-portfolio/Assets/portfolio/photography/photo1.jpg"
                    );


                if (
                    !imageUrl ||
                    !imageUrl.trim()
                ) {

                    return;

                }


                const description =
                    prompt(
                        "Photo description (optional):"
                    ) || "";


                try {

                    await addDoc(
                        collection(
                            db,
                            "portfolio_photos"
                        ),
                        {

                            categoryId:
                                currentCategoryId,

                            title:
                                title.trim(),

                            description:
                                description.trim(),

                            imageUrl:
                                imageUrl.trim(),

                            sortOrder:
                                Date.now(),

                            isCover:
                                false,

                            visible:
                                true,

                            createdAt:
                                serverTimestamp()

                        }
                    );


                    await loadPhotos();


                } catch (error) {

                    console.error(
                        error
                    );


                    alert(
                        "Unable to add photo:\n\n" +
                        error.message
                    );

                }

            }
        );



        /* =====================================================
           SET COVER
        ====================================================== */

        async function setCover(
            photoId
        ) {

            try {

                const photoQuery =
                    query(
                        collection(
                            db,
                            "portfolio_photos"
                        ),
                        orderBy(
                            "sortOrder"
                        )
                    );


                const snapshot =
                    await getDocs(
                        photoQuery
                    );


                const updates = [];


                snapshot.forEach(
                    item => {

                        const data =
                            item.data();


                        if (
                            data.categoryId ===
                            currentCategoryId
                        ) {

                            updates.push(

                                updateDoc(
                                    doc(
                                        db,
                                        "portfolio_photos",
                                        item.id
                                    ),
                                    {

                                        isCover:
                                            item.id ===
                                            photoId

                                    }
                                )

                            );

                        }

                    }
                );


                await Promise.all(
                    updates
                );


                await loadPhotos();


            } catch (error) {

                console.error(
                    error
                );


                alert(
                    "Unable to set cover:\n\n" +
                    error.message
                );

            }

        }



        /* =====================================================
           EDIT PHOTO
        ====================================================== */

        async function editPhoto(
            photo
        ) {

            const title =
                prompt(
                    "Photo title:",
                    photo.title || ""
                );


            if (
                !title ||
                !title.trim()
            ) {

                return;

            }


            const imageUrl =
                prompt(
                    "Image URL:",
                    photo.imageUrl || ""
                );


            if (
                !imageUrl ||
                !imageUrl.trim()
            ) {

                return;

            }


            const description =
                prompt(
                    "Description:",
                    photo.description || ""
                ) || "";


            try {

                await updateDoc(
                    doc(
                        db,
                        "portfolio_photos",
                        photo.id
                    ),
                    {

                        title:
                            title.trim(),

                        description:
                            description.trim(),

                        imageUrl:
                            imageUrl.trim()

                    }
                );


                await loadPhotos();


            } catch (error) {

                console.error(
                    error
                );


                alert(
                    "Unable to edit photo:\n\n" +
                    error.message
                );

            }

        }



        /* =====================================================
           DELETE PHOTO
        ====================================================== */

        async function deletePhoto(
            photo
        ) {

            const confirmed =
                confirm(
                    "Delete \"" +
                    photo.title +
                    "\"?"
                );


            if (!confirmed) {

                return;

            }


            try {

                await deleteDoc(
                    doc(
                        db,
                        "portfolio_photos",
                        photo.id
                    )
                );


                await loadPhotos();


            } catch (error) {

                console.error(
                    error
                );


                alert(
                    "Unable to delete photo:\n\n" +
                    error.message
                );

            }

        }

    </script>

</body>
