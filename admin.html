<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ReyCreate Studio | Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 20px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    header h1 {
      margin-bottom: 5px;
    }

    header p {
      color: #bbb;
    }

    .login-box,
    .admin-panel {
      background: white;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    .login-box {
      max-width: 450px;
      margin: 50px auto;
    }

    .login-box h2 {
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn {
      border: 0;
      border-radius: 7px;
      padding: 10px 15px;
      margin: 4px;
      background: #222;
      color: white;
    }

    .btn:hover {
      opacity: .85;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #111;
    }

    .btn-green {
      background: #16803c;
    }

    .btn-blue {
      background: #1769aa;
    }

    .btn-red {
      background: #c62828;
    }

    .btn-gray {
      background: #777;
    }

    .btn-orange {
      background: #d97706;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .toolbar .btn {
      margin: 0;
    }

    .status {
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #e8f5e9;
      color: #166534;
    }

    .status.error {
      background: #ffebee;
      color: #b91c1c;
    }

    .status.info {
      background: #e3f2fd;
      color: #075985;
    }

    .category-tree {
      margin-top: 20px;
    }

    .category-item {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .category-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px;
    }

    .category-info {
      flex: 1;
      min-width: 0;
    }

    .category-name {
      font-weight: 700;
      font-size: 16px;
    }

    .category-meta {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    .category-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .children {
      margin-left: 25px;
      border-left: 2px solid #ddd;
      padding-left: 10px;
    }

    .hidden-label {
      color: #c62828;
      font-weight: bold;
    }

    .photo-list {
      padding: 15px;
      border-top: 1px solid #ddd;
      background: white;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .photo-card {
      border: 1px solid #ddd;
      border-radius: 9px;
      overflow: hidden;
      background: white;
    }

    .photo-preview {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      background: #eee;
    }

    .photo-info {
      padding: 10px;
    }

    .photo-title {
      font-weight: bold;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .photo-description {
      color: #777;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .photo-actions {
      display: flex;
      flex-wrap: wrap;
    }

    .photo-actions .btn {
      font-size: 12px;
      padding: 7px 9px;
    }

    .cover-badge {
      display: inline-block;
      background: #f59e0b;
      color: white;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 7px;
    }

    .empty {
      color: #777;
      padding: 15px;
      text-align: center;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 12px;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-modal {
      border: 0;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
    }

    .selected-file {
      margin-top: 8px;
      font-size: 13px;
      color: #555;
      word-break: break-word;
    }

    .upload-progress {
      height: 8px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
      display: none;
    }

    .upload-progress-bar {
      height: 100%;
      width: 0%;
      background: #16803c;
      transition: width .2s;
    }

    .logout {
      float: right;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #777;
    }

    @media (max-width: 700px) {
      body {
        padding: 10px;
      }

      .category-row {
        flex-direction: column;
        align-items: stretch;
      }

      .category-actions {
        justify-content: flex-start;
      }

      .children {
        margin-left: 10px;
      }

      .photo-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 430px) {
      .photo-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <button
      id="logout-btn"
      class="btn btn-red logout"
      style="display:none;"
      type="button"
    >
      Logout
    </button>

    <h1>ReyCreate Studio</h1>
    <p>Portfolio Administration</p>
  </header>

  <!-- LOGIN -->

  <div id="login-section" class="login-box">

    <h2>Admin Login</h2>

    <div id="login-status" class="status"></div>

    <form id="login-form">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button
        id="login-btn"
        type="submit"
        class="btn btn-primary"
      >
        Login
      </button>

    </form>

  </div>

  <!-- ADMIN -->

  <div
    id="admin-section"
    class="admin-panel"
    style="display:none;"
  >

    <div id="admin-status" class="status"></div>

    <div class="toolbar">

      <button
        id="add-category-btn"
        class="btn btn-primary"
        type="button"
      >
        + Add Category
      </button>

      <button
        id="refresh-btn"
        class="btn btn-gray"
        type="button"
      >
        ↻ Refresh
      </button>

      <a
        href="index.html#portfolio"
        target="_blank"
        rel="noopener"
        class="btn btn-blue"
      >
        View Portfolio
      </a>

    </div>

    <h2>Portfolio Categories</h2>

    <div
      id="category-tree"
      class="category-tree"
    >
      <div class="loading">
        Loading portfolio...
      </div>
    </div>

  </div>

</div>

<!-- PHOTO MODAL -->

<div id="photo-modal" class="modal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Add Photo</h2>

      <button
        id="close-photo-modal"
        class="close-modal"
        type="button"
      >
        &times;
      </button>
    </div>

    <div id="photo-status" class="status"></div>

    <form id="photo-form">

      <div class="form-group">

        <label for="photo-file">Choose Image</label>

        <input
          id="photo-file"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/gif"
          required
        >

        <div id="selected-file" class="selected-file"></div>

      </div>

      <div class="form-group">

        <label for="photo-title">Photo Title</label>

        <input
          id="photo-title"
          type="text"
          required
          placeholder="Example: Wedding Ceremony"
        >

      </div>

      <div class="form-group">

        <label for="photo-description">Description</label>

        <textarea
          id="photo-description"
          placeholder="Optional description"
        ></textarea>

      </div>

      <div
        id="upload-progress"
        class="upload-progress"
      >
        <div
          id="upload-progress-bar"
          class="upload-progress-bar"
        ></div>
      </div>

      <button
        id="upload-photo-btn"
        type="submit"
        class="btn btn-green"
      >
        Upload Photo
      </button>

      <button
        id="cancel-photo-btn"
        type="button"
        class="btn btn-gray"
      >
        Cancel
      </button>

    </form>

  </div>

</div>

<!-- EDIT PHOTO MODAL -->

<div id="edit-photo-modal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>Edit Photo</h2>

      <button
        id="close-edit-photo-modal"
        class="close-modal"
        type="button"
      >
        &times;
      </button>

    </div>

    <div id="edit-photo-status" class="status"></div>

    <form id="edit-photo-form">

      <input
        id="edit-photo-id"
        type="hidden"
      >

      <div class="form-group">

        <label for="edit-photo-title">
          Photo Title
        </label>

        <input
          id="edit-photo-title"
          type="text"
          required
        >

      </div>

      <div class="form-group">

        <label for="edit-photo-description">
          Description
        </label>

        <textarea
          id="edit-photo-description"
        ></textarea>

      </div>

      <div class="form-group">

        <label for="edit-photo-file">
          Replace Image
        </label>

        <input
          id="edit-photo-file"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/gif"
        >

      </div>

      <button
        type="submit"
        class="btn btn-green"
      >
        Save Changes
      </button>

      <button
        id="cancel-edit-photo-btn"
        type="button"
        class="btn btn-gray"
      >
        Cancel
      </button>

    </form>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyBlbeyeynUXvrSE-TBVjwaEiBobHTrBlQo",
  authDomain: "reycreatestudio-portfoli-9b09b.firebaseapp.com",
  projectId: "reycreatestudio-portfoli-9b09b",
  storageBucket: "reycreatestudio-portfoli-9b09b.firebasestorage.app",
  messagingSenderId: "41750977632",
  appId: "1:41750977632:web:f202e8614f20e5d9ceb705"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


const loginSection =
  document.getElementById("login-section");

const adminSection =
  document.getElementById("admin-section");

const loginForm =
  document.getElementById("login-form");

const logoutBtn =
  document.getElementById("logout-btn");

const status =
  document.getElementById("login-status");

const loginButton =
  document.getElementById("login-btn");


function showStatus(message, type) {

  status.textContent = message;

  status.className =
    "status show " + type;

}


/* ================================
   LOGIN
================================ */

loginForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;


    loginButton.disabled = true;

    showStatus(
      "Checking login...",
      "info"
    );


    try {

      const result =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      console.log(
        "LOGIN SUCCESS:",
        result.user.email
      );


      showStatus(
        "Login successful.",
        "success"
      );


    } catch (error) {

      console.error(
        "LOGIN ERROR:",
        error.code,
        error.message
      );


      showStatus(
        error.code +
        " — " +
        error.message,
        "error"
      );


      loginButton.disabled = false;

    }

  }
);


/* ================================
   AUTH STATE
================================ */

onAuthStateChanged(
  auth,
  (user) => {

    console.log(
      "AUTH STATE:",
      user
        ? user.email
        : "NO USER"
    );


    if (user) {

      loginSection.style.display =
        "none";

      adminSection.style.display =
        "block";

      logoutBtn.style.display =
        "block";


    } else {

      loginSection.style.display =
        "block";

      adminSection.style.display =
        "none";

      logoutBtn.style.display =
        "none";

      loginButton.disabled =
        false;

    }

  }
);


/* ================================
   LOGOUT
================================ */

logoutBtn.addEventListener(
  "click",
  async () => {

    await signOut(auth);

  }
);

</script>

</body>
</html>
